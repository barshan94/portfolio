name: Sync projects

on:
  schedule:
    # Every Monday at 08:00 UTC — runs when the repo is idle.
    - cron: "0 8 * * 1"
  workflow_dispatch:
    # Manual trigger from the Actions tab.

jobs:
  sync:
    runs-on: ubuntu-latest
    # Never auto-merge. A human reviews the PR before anything goes live.
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm ci

      - name: Sync new repos into content
        run: node scripts/sync-projects.mjs

      - name: Commit and open PR (if anything changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add src/content/projects/ sync-map.json
              

          if git diff --quiet && git diff --cached --quiet; then
            echo "No new repos found — nothing to commit."
            exit 0
          fi

          BRANCH="sync/new-repos-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
      
          git commit -m "Sync new GitHub repos into portfolio content

          Auto-generated by the sync-projects workflow."
          git push origin "$BRANCH"

          gh pr create \
            --title "Sync new repos into portfolio" \
            --body "Automatically generated by the weekly sync-projects workflow.

          Review the new project entries under src/content/projects/ and merge when ready." \
            --base main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
