name: Sync showcased GitHub projects

on:
  schedule:
    # Check once per hour for repositories tagged for the portfolio.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm ci

      - name: Sync only portfolio-showcase repositories
        run: node scripts/sync-projects.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate generated content
        run: npm run build

      - name: Commit and open review PR if anything changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/projects/ src/data/portfolio-showcase.json

          if git diff --cached --quiet; then
            echo "No changes found for portfolio-showcase repositories."
            exit 0
          fi

          BRANCH="sync/showcased-repos-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git commit -m "Sync portfolio-showcase GitHub repositories"
          git push origin "$BRANCH"

          gh pr create \
            --title "Review showcased GitHub projects" \
            --body "Generated from public repositories tagged portfolio-showcase.

          Review project descriptions and links before merging. Existing hand-curated project files are preserved. Merging updates the repository archive and refreshes the CV project appendix." \
            --base main
