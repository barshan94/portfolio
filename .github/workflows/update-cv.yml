name: Refresh CV project appendix

on:
  push:
    branches:
      - main
    paths:
      - "src/data/portfolio-showcase.json"
      - "src/content/projects/**"
      - "scripts/update_cv_pdf.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-cv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF tools
        run: python -m pip install --upgrade pypdf reportlab

      - name: Append showcased projects to the current CV
        run: python scripts/update_cv_pdf.py

      - name: Commit refreshed CV PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "The CV PDF is already up to date."
            exit 0
          fi

          git commit -m "Refresh CV with showcased GitHub projects"
          git push origin main
