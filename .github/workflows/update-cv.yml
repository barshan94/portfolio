name: Generate monochrome CV PDF

on:
  push:
    branches:
      - main
    paths:
      - "cv-projects.json"
      - "scripts/update_cv_pdf.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-cv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF generator
        run: python -m pip install --upgrade reportlab

      - name: Generate complete CV
        run: python scripts/update_cv_pdf.py

      - name: Commit refreshed CV PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "public/Barshan Ghosh.pdf"

          if git diff --cached --quiet; then
            echo "The CV PDF is already up to date."
            exit 0
          fi

          git commit -m "Generate updated monochrome CV"
          git push origin main
