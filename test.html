<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Animation Test</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#080d1a}
canvas{position:fixed;inset:0;width:100%;height:100%}
#debug{position:fixed;top:10px;left:10px;color:#fff;font:14px monospace;z-index:99;background:rgba(0,0,0,.7);padding:8px 12px;border-radius:4px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="debug">Loading...</div>
<script>
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var debug = document.getElementById('debug');
var frameCount = 0;
var W = 0;
var H = 0;

function resize() {
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener('resize', resize);
resize();

function loop() {
  requestAnimationFrame(loop);
  frameCount++;

  // Clear
  ctx.fillStyle = '#080d1a';
  ctx.fillRect(0, 0, W, H);

  // Moving circle to prove animation works
  var x = W * 0.5 + Math.cos(frameCount * 0.02) * 150;
  var y = H * 0.5 + Math.sin(frameCount * 0.02) * 100;

  // Gold glow
  ctx.globalAlpha = 0.15;
  var g = ctx.createRadialGradient(x, y, 0, x, y, 80);
  g.addColorStop(0, '#d4af55');
  g.addColorStop(1, 'rgba(212,175,85,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y, 80, 0, 6.283);
  ctx.fill();

  // Core dot
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#f0ead6';
  ctx.beginPath();
  ctx.arc(x, y, 6, 0, 6.283);
  ctx.fill();

  // Trail particles
  for (var i = 0; i < 20; i++) {
    var tx = W * 0.5 + Math.cos((frameCount - i * 3) * 0.02) * 150;
    var ty = H * 0.5 + Math.sin((frameCount - i * 3) * 0.02) * 100;
    ctx.globalAlpha = (1 - i / 20) * 0.4;
    ctx.fillStyle = '#d4af55';
    ctx.beginPath();
    ctx.arc(tx, ty, 3 - i * 0.1, 0, 6.283);
    ctx.fill();
  }

  ctx.globalAlpha = 1;

  // Debug counter
  debug.textContent = 'Frame: ' + frameCount + ' | Size: ' + W + 'x' + H;
}

debug.textContent = 'Starting loop...';
requestAnimationFrame(loop);
</script>
</body>
</html>
