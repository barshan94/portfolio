<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07090D">
<title>Money Calculator — Cinematic Transition</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#07090D;color:#eaf0f6;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}#stage{position:fixed;inset:0;display:grid;place-items:center}canvas{display:block;width:100%;height:100%}.ctl{position:fixed;right:14px;bottom:12px;display:flex;gap:6px;opacity:.24;transition:opacity .25s}.ctl:hover,.ctl:focus-within{opacity:1}.ctl button{background:#111923d9;color:#aab4c4;border:1px solid #46546b80;border-radius:6px;padding:6px 10px;font:600 11px/1.4 system-ui;cursor:pointer;letter-spacing:.04em}.ctl button:hover,.ctl button:focus-visible{background:#202c3a;color:#fff;outline:2px solid #39e6d0;outline-offset:2px}
</style>
</head>
<body>
<div id="stage"><canvas id="cv" role="img" aria-label="Animated illustrative Money Calculator financial system showing account balances, transactions, ledger posting and reconciliation"></canvas><div class="ctl"><button id="btnPlay" aria-label="Pause animation">PAUSE</button><button id="btnReplay">REPLAY</button></div></div>
<script>
(function(){
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d"),DW=1600,DH=900,TAU=Math.PI*2,LOOP=24;
var FN='Inter,system-ui,-apple-system,"Segoe UI",sans-serif',MO='ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace';
var C={bg:"#07090D",cy:[57,230,208],bl:[100,140,255],am:[255,191,105],tx:[234,240,246],mu:[132,146,166],ln:[70,90,120]};
var CX=700,CY=470;
function cl(v,a,b){return v<a?a:v>b?b:v}function lr(a,b,t){return a+(b-a)*t}function sm(a,b,x){var t=cl((x-a)/(b-a),0,1);return t*t*(3-2*t)}function eo(t){return 1-(1-t)*(1-t)}function rgba(c,a){return"rgba("+c[0]+","+c[1]+","+c[2]+","+a+")"}function nf(n){return Math.round(n).toLocaleString("en-US")}function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.closePath()}
var AB={bank:248500,mfs:32750,cash:18200,save:410000},LOAN0=185000;
var EV=[
{t:3,k:"income",lb:"Salary Credited",am:92000,fx:[["bank",92000]]},
{t:3.9,k:"expense",lb:"Grocery & Bills",am:7450,fx:[["cash",-7450]]},
{t:4.8,k:"transfer",lb:"Bank → Mobile",am:15000,fx:[["bank",-15000],["mfs",15000]]},
{t:5.7,k:"repayment",lb:"Loan Installment",am:18000,fx:[["bank",-18000]],ld:-18000},
{t:6.6,k:"deposit",lb:"Savings Deposit",am:40000,fx:[["bank",-40000],["save",40000]]},
{t:12.2,k:"income",lb:"Tuition Income",am:26500,fx:[["mfs",26500]]},
{t:13,k:"expense",lb:"Vendor Payment",am:12300,fx:[["bank",-12300]]},
{t:13.8,k:"transfer",lb:"Mobile → Cash",am:6000,fx:[["mfs",-6000],["cash",6000]]},
{t:14.6,k:"repayment",lb:"Equipment Loan",am:9500,fx:[["bank",-9500]],ld:-9500},
{t:15.4,k:"deposit",lb:"Fixed Deposit",am:50000,fx:[["bank",-50000],["save",50000]]}
];
function ramp(e,t){return t<e.t?0:t>=e.t+1.3?1:eo((t-e.t)/1.3)}function bal(id,t){var v=AB[id];EV.forEach(function(e){var r=ramp(e,t);e.fx.forEach(function(f){if(f[0]===id)v+=f[1]*r})});return Math.round(v)}function assets(t){return bal("bank",t)+bal("mfs",t)+bal("cash",t)+bal("save",t)}function loan(t){var v=LOAN0;EV.forEach(function(e){if(e.ld)v+=e.ld*ramp(e,t)});return Math.round(v)}function posted(t){return EV.filter(function(e){return t>=e.t+1.3}).length}
var ACC=[{id:"bank",lb:"BANK",sub:"Current A/C",x:248,y:248,col:C.cy},{id:"mfs",lb:"MOBILE",sub:"MFS Wallet",x:941,y:248,col:C.bl},{id:"cash",lb:"CASH",sub:"Petty Cash",x:248,y:582,col:C.am},{id:"save",lb:"SAVINGS",sub:"Deposit A/C",x:941,y:582,col:C.cy}],KC={income:C.cy,expense:C.am,transfer:C.bl,repayment:C.am,deposit:C.cy};
var CK=[{t:0,z:.78,x:0,y:0},{t:2.5,z:.95,x:0,y:0},{t:3.5,z:1,x:0,y:0},{t:7,z:1.04,x:-20,y:8},{t:12,z:1.07,x:35,y:-12},{t:17,z:.97,x:0,y:8},{t:21,z:1,x:0,y:0},{t:22.5,z:.92,x:0,y:0},{t:24,z:.78,x:0,y:0}];
function camera(t){var i=0;while(i<CK.length-2&&t>=CK[i+1].t)i++;var a=CK[i],b=CK[i+1],f=sm(a.t,b.t,t);return{z:lr(a.z,b.z,f),x:lr(a.x,b.x,f),y:lr(a.y,b.y,f)}}function env(t){return cl(Math.min(sm(.3,2.8,t),1-sm(21.5,23.7,t)),0,1)}
function hex(x,y,r){ctx.beginPath();for(var i=0;i<6;i++){var a=TAU/6*i-Math.PI/6,px=x+r*Math.cos(a),py=y+r*Math.sin(a);i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath()}
function text(s,x,y,size,col,align,font,weight){ctx.fillStyle=col;ctx.font=(weight||600)+" "+size+"px "+(font||FN);ctx.textAlign=align||"center";ctx.textBaseline="middle";ctx.fillText(s,x,y)}
function panel(x,y,w,h,a){ctx.fillStyle="rgba(12,16,24,"+(a*.78)+")";rr(x,y,w,h,8);ctx.fill();ctx.strokeStyle=rgba(C.ln,a*.3);ctx.lineWidth=.8;ctx.stroke()}
function drawBG(t,e){ctx.fillStyle=C.bg;ctx.fillRect(0,0,DW,DH);ctx.strokeStyle=rgba(C.ln,.04*e);ctx.lineWidth=.5;for(var x=0;x<DW;x+=60){ctx.beginPath();ctx.moveTo(x+(t*8)%60,0);ctx.lineTo(x+(t*8)%60,DH);ctx.stroke()}for(var y=0;y<DH;y+=60){ctx.beginPath();ctx.moveTo(0,y+(t*5)%60);ctx.lineTo(DW,y+(t*5)%60);ctx.stroke()}for(var i=0;i<40;i++){var seed=i*137.508,px=((seed*7.3+t*12*(1+i%3*.3))%DW+DW)%DW,py=((seed*3.1+t*8*(1+i%2*.5))%DH+DH)%DH;ctx.fillStyle=rgba(i%3===0?C.cy:i%3===1?C.bl:C.am,.06*e*(.5+.5*Math.sin(t*1.5+seed)));ctx.beginPath();ctx.arc(px,py,1.2,0,TAU);ctx.fill()}}
function drawStreams(t,e){for(var i=0;i<8;i++){var a=TAU/8*i+t*.15,sx=CX+Math.cos(a)*700,sy=CY+Math.sin(a)*500,ex=CX+Math.cos(a)*80,ey=CY+Math.sin(a)*60,c=i%2?C.bl:C.cy;for(var j=0;j<14;j++){var f=((t*.4+j/14+i*.13)%1+1)%1;ctx.fillStyle=rgba(c,e*Math.sin(f*Math.PI)*.25);ctx.beginPath();ctx.arc(lr(sx,ex,f),lr(sy,ey,f),1.5,0,TAU);ctx.fill()}}}
function drawCore(t,e){var planes=[["EVENT INTAKE",80,C.bl],["VALIDATION",30,C.cy],["LEDGER POSTING",-20,C.am],["NET POSITION",-70,C.cy]],active=0;EV.forEach(function(v){var r=ramp(v,t);if(r>0&&r<1)active=Math.max(active,1-r)});planes.forEach(function(p,i){var x=CX,y=CY+p[1],a=e*(.35+active*.3);ctx.fillStyle=rgba(p[2],a*.3);ctx.beginPath();ctx.moveTo(x,y-75);ctx.lineTo(x+150,y);ctx.lineTo(x,y+75);ctx.lineTo(x-150,y);ctx.closePath();ctx.fill();ctx.strokeStyle=rgba(p[2],a*.6);ctx.lineWidth=1;ctx.stroke();ctx.fillStyle=rgba(C.tx,a*.8);text(p[0],x,y,9,rgba(C.tx,a*.8),"center",FN,600)});if(e>.25){var ta=e*sm(2,3.5,t);text("AVAILABLE BALANCE · LIQUID ACCOUNTS",CX,CY-120,10,rgba(C.mu,ta*.7),"center",FN,600);text("BDT "+nf(assets(t)),CX,CY-92,28,rgba(C.tx,ta),"center",FN,700);text("NET POSITION  ·  BDT "+nf(assets(t)-loan(t)),CX,CY-48,13,rgba(C.cy,ta*.85),"center",MO,700);["INPUT","VALIDATE","POST","SYNC"].forEach(function(s,i){var done=posted(t)>=(i+1)*2.5;ctx.fillStyle=rgba(done?C.cy:C.mu,ta*.7);ctx.beginPath();ctx.arc(CX-120+i*80,CY+110,3,0,TAU);ctx.fill();text(s,CX-120+i*80,CY+123,7,rgba(done?C.tx:C.mu,ta*.55),"center",FN,500)});if(t>18){ctx.fillStyle=rgba(C.cy,ta*.12);rr(CX-90,CY+135,180,22,4);ctx.fill();text("LEDGER RECONCILED · BALANCED",CX,CY+146,8,rgba(C.cy,ta*.9),"center",FN,700)}}}
function glyph(x,y,k,c){ctx.strokeStyle=rgba(c,.9);ctx.lineWidth=1.6;ctx.lineCap="round";ctx.beginPath();if(k==="income"||k==="deposit"){ctx.moveTo(x,y+6);ctx.lineTo(x,y-6);ctx.moveTo(x-4,y-2);ctx.lineTo(x,y-6);ctx.lineTo(x+4,y-2)}else if(k==="expense"){ctx.moveTo(x,y-6);ctx.lineTo(x,y+6);ctx.moveTo(x-4,y+2);ctx.lineTo(x,y+6);ctx.lineTo(x+4,y+2)}else{ctx.moveTo(x-6,y);ctx.lineTo(x+6,y);ctx.moveTo(x+2,y-4);ctx.lineTo(x+6,y);ctx.lineTo(x+2,y+4)}ctx.stroke()}
function drawAccounts(t,e){ACC.forEach(function(a){var b=bal(a.id,t),al=e*sm(1.5,3,t);EV.forEach(function(v){var r=ramp(v,t);if(r>0&&r<1)v.fx.forEach(function(f){if(f[0]===a.id){ctx.strokeStyle=rgba(f[1]>0?C.cy:C.am,(1-r)*al*.5);hex(a.x,a.y,34+(1-r)*30);ctx.stroke()}})});ctx.fillStyle=rgba(a.col,al*.1);hex(a.x,a.y,34);ctx.fill();ctx.strokeStyle=rgba(a.col,al*.55);hex(a.x,a.y,34);ctx.stroke();glyph(a.x,a.y-6,a.id==="cash"?"income":a.id==="mfs"?"transfer":"deposit",a.col);text(a.lb,a.x,a.y+14,9,rgba(C.tx,al*.85),"center",FN,700);text(a.sub,a.x,a.y+25,7,rgba(C.mu,al*.6),"center",FN,500);text("BDT "+nf(b),a.x,a.y+43,11,rgba(C.tx,al),"center",MO,700)})}
function drawTransactions(t,e){EV.forEach(function(v){var r=ramp(v,t);if(r<=0||r>=1)return;var c=KC[v.k],a=e*Math.sin(r*Math.PI),target=ACC.find(function(z){return z.id===v.fx[0][0]})||ACC[0],f=cl(r*2,0,1),x=lr(CX-350,target.x,f),y=lr(CY,target.y,f)-Math.sin(f*Math.PI)*40;ctx.fillStyle=rgba(c,a*.8);ctx.beginPath();ctx.arc(x,y,4,0,TAU);ctx.fill();ctx.fillStyle=rgba(c,a*.2);ctx.beginPath();ctx.arc(x,y,10,0,TAU);ctx.fill();if(r>.2&&r<.8){text(v.lb,x,y-17,9,rgba(C.tx,a*.8),"center",FN,600);text((v.k==="expense"||v.k==="repayment"?"−":"+")+"BDT "+nf(v.am),x,y-5,10,rgba(c,a),"center",MO,700)}})}
function drawSats(t,e){var ss=[["LOANS",nf(loan(t))+" due",354,398,C.am],["TUITION","26,500 in",1086,398,C.bl],["BUDGET","68% used",354,562,C.mu],["DEPOSITS",nf(bal("save",t)),1086,562,C.cy]];ss.forEach(function(s){var a=e*sm(12,13.5,t);ctx.fillStyle=rgba(s[4],a*.08);rr(s[2]-50,s[3]-16,100,32,6);ctx.fill();ctx.strokeStyle=rgba(s[4],a*.25);ctx.stroke();text(s[0],s[2],s[3]-5,7,rgba(C.mu,a*.65),"center",FN,600);text(s[1],s[2],s[3]+8,9,rgba(C.tx,a*.85),"center",MO,700)})}
function drawLedger(t,e){var a=e*sm(6.5,8,t);if(a<.02)return;var x=1120,y=200,w=280,h=340;panel(x,y,w,h,a);text("GENERAL LEDGER",x+14,y+22,10,rgba(C.tx,a*.85),"left",FN,700);var pn=posted(t),start=Math.max(0,pn-6);for(var i=start;i<pn;i++){var v=EV[i],ry=y+42+(i-start)*38,c=KC[v.k];ctx.fillStyle=rgba(c,a*.15);rr(x+8,ry,w-16,32,4);ctx.fill();text(v.lb,x+14,ry+12,9,rgba(C.tx,a*.8),"left",FN,600);var dr=v.k==="income"?"CASH IN":v.k==="expense"?"EXPENSE":v.k==="transfer"?"TRANSFER":v.k==="repayment"?"LOAN":"SAVINGS";text("DR/CR · "+dr,x+14,ry+25,8,rgba(C.mu,a*.65),"left",MO,500);text("BDT "+nf(v.am),x+w-14,ry+19,9,rgba(c,a),"right",MO,700)}text("ENTRIES "+pn+" / "+EV.length,x+14,y+h-20,8,rgba(C.mu,a*.65),"left",FN,500);text(pn===EV.length&&t>18?"RECONCILED":"POSTING",x+w-14,y+h-20,8,rgba(pn===EV.length&&t>18?C.cy:C.am,a*.8),"right",FN,700)}
function drawIntel(t,e){var a=e*sm(17.1,18.5,t);if(a<.02)return;var x=1120,y=560,w=280,h=200;panel(x,y,w,h,a);text("FINANCIAL INTELLIGENCE",x+14,y+20,10,rgba(C.tx,a*.8),"left",FN,700);var ins=[86,92,78,95,101,118.5],outs=[52,47,61,49,44,47.3],cx=x+14,cy=y+36,cw=w-28,ch=50;[[ins,C.cy],[outs,C.am]].forEach(function(series){ctx.strokeStyle=rgba(series[1],a*.7);ctx.lineWidth=1.5;ctx.beginPath();series[0].forEach(function(v,i){var px=cx+i*cw/5,py=cy+ch-v/120*ch;i?ctx.lineTo(px,py):ctx.moveTo(px,py)});ctx.stroke()});["JAN","FEB","MAR","APR","MAY","JUN"].forEach(function(s,i){text(s,cx+i*cw/5,cy+ch+10,6,rgba(C.mu,a*.6),"center",FN,500)});text("LOANS  "+nf(loan(t)),x+14,y+112,10,rgba(C.am,a*.9),"left",MO,700);text("ASSETS  "+nf(assets(t)),x+14,y+135,10,rgba(C.cy,a*.9),"left",MO,700);text("SAVINGS RATE  38.2%",x+14,y+158,9,rgba(C.bl,a*.9),"left",MO,700);text("ILLUSTRATIVE HISTORY · NOT LIVE DATA",x+14,y+184,7,rgba(C.mu,a*.65),"left",FN,500)}
function drawBrand(t,e){var a=e*sm(20.8,22,t);text("MONEY CALCULATOR",800,828,36,rgba(C.tx,a*.95),"center",FN,800);text("One ledger. Connected financial decisions.",800,852,13,rgba(C.mu,a*.7),"center",FN,400);text("TRANSACTION ENGINE  ·  ACCOUNT SYNCHRONIZATION  ·  LEDGER INTEGRITY",800,872,8,rgba(C.ln,a*.8),"center",FN,600)}
function drawHeader(t,e){var a=e*sm(1,2.5,t);text("SIMULATED SYSTEM  ·  DEMO TRANSACTIONS  ·  AMOUNTS IN BDT",800,28,8,rgba(C.mu,a*.55),"center",FN,600);var x=600,y=892,w=400;ctx.strokeStyle=rgba(C.ln,a*.3);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+w,y);ctx.stroke();[3,7,12,17,21].forEach(function(v){ctx.fillStyle=rgba(t>=v?C.cy:C.mu,a*.65);ctx.beginPath();ctx.arc(x+v/LOOP*w,y,2.5,0,TAU);ctx.fill()});ctx.fillStyle=rgba(C.cy,a*.85);ctx.beginPath();ctx.arc(x+t/LOOP*w,y,3.5,0,TAU);ctx.fill()}
function render(t){var e=env(t),cam=camera(t);ctx.clearRect(0,0,DW,DH);drawBG(t,e);ctx.save();ctx.translate(DW/2,DH/2);ctx.scale(cam.z,cam.z);ctx.translate(-DW/2+cam.x,-DH/2+cam.y);drawStreams(t,e);drawCore(t,e);drawAccounts(t,e);drawTransactions(t,e);drawSats(t,e);drawLedger(t,e);drawIntel(t,e);ctx.restore();drawBrand(t,e);drawHeader(t,e);var g=ctx.createRadialGradient(800,450,315,800,450,810);g.addColorStop(0,"rgba(7,9,13,0)");g.addColorStop(1,"rgba(7,9,13,.55)");ctx.fillStyle=g;ctx.fillRect(0,0,DW,DH);[3,7,12,17,21].forEach(function(v){var d=Math.abs(t-v);if(d<.5){ctx.fillStyle=rgba(C.cy,(1-d/.5)**2*e*.12);ctx.fillRect(0,0,DW,DH)}})}
var raf=null,running=false,elapsed=0,lastTS=0,reduced=window.matchMedia("(prefers-reduced-motion: reduce)").matches,SPEED=reduced?.35:1,stage=document.getElementById("stage");
function resize(){var dpr=Math.min(window.devicePixelRatio||1,2),w=stage.clientWidth,h=stage.clientHeight;cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);cv.style.width=w+"px";cv.style.height=h+"px";var s=Math.min(w/DW,h/DH);ctx.setTransform(s*dpr,0,0,s*dpr,(w*dpr-DW*s*dpr)/2,(h*dpr-DH*s*dpr)/2);render(elapsed%LOOP)}
function tick(ts){if(!running)return;if(!lastTS)lastTS=ts;var dt=(ts-lastTS)/1000;lastTS=ts;if(dt>.1)dt=.016;elapsed+=dt*SPEED;render(elapsed%LOOP);raf=requestAnimationFrame(tick)}
function start(){if(running)return;running=true;lastTS=0;raf=requestAnimationFrame(tick);document.getElementById("btnPlay").textContent="PAUSE";document.getElementById("btnPlay").setAttribute("aria-label","Pause animation")}
function stop(){running=false;if(raf)cancelAnimationFrame(raf);raf=null;document.getElementById("btnPlay").textContent="PLAY";document.getElementById("btnPlay").setAttribute("aria-label","Play animation")}
document.getElementById("btnPlay").addEventListener("click",function(){running?stop():start()});document.getElementById("btnReplay").addEventListener("click",function(){elapsed=0;lastTS=0;render(0);if(!running)start()});document.addEventListener("visibilitychange",function(){if(document.hidden){if(raf)cancelAnimationFrame(raf);raf=null}else if(running){lastTS=0;raf=requestAnimationFrame(tick)}});window.addEventListener("pagehide",stop);window.addEventListener("resize",resize);if(window.ResizeObserver)new ResizeObserver(resize).observe(stage);resize();start();
})();
</script>
</body>
