    metric(276,202,396,'Net worth',186500,'Assets less liabilities',C.blue,p);metric(690,202,396,'Cash-flow forecast',31000,'Projected next month',C.green,p);metric(1104,202,436,'Financial health',82,'Illustrative score / 100',C.amber,p);
    card(276,324,780,310,'Net-worth trend','Historical values and a forward-looking projection');
    const gx=315,gy=387,gw=695,gh=175;for(let i=0;i<4;i++)ln(gx,gy+i*43,gx+gw,gy+i*43,'#1b292f');
    const hist=[.32,.4,.37,.52,.58,.65,.7,.79,.87],labels=['Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct'];
    ctx.beginPath();hist.forEach((v,i)=>{const xx=gx+i*gw/(hist.length-1),yy=gy+145-v*140*ease(p);if(i===0)ctx.moveTo(xx,yy);else ctx.lineTo(xx,yy)});ctx.strokeStyle=C.blue;ctx.lineWidth=3;ctx.lineJoin='round';ctx.stroke();
    ctx.setLineDash([6,5]);ctx.beginPath();ctx.moveTo(gx+gw*.78,gy+145-hist[7]*140*ease(p));ctx.lineTo(gx+gw,gy+145-.97*140*ease(p));ctx.strokeStyle=C.green;ctx.lineWidth=2;ctx.stroke();ctx.setLineDash([]);
    labels.forEach((m,i)=>txt(m,gx+i*gw/(labels.length-1),gy+168,10,C.muted,450,'center'));pill('Actual',834,355,C.blue,C.blueSoft,62);pill('Forecast',906,355,C.green,C.greenSoft,82);
    card(1074,324,466,310,'Financial insights','Signals derived from recorded financial activity');
    [['Liquidity outlook','Healthy',C.green],['Budget warning','Bills over limit',C.amber],['Tuition outstanding','৳4,500',C.red],['Recurring expenses','5 scheduled',C.blue]].forEach((r,i)=>{const y=389+i*50;circ(1096,y-4,5,r[2]);txt(r[0],1112,y,11,C.muted,500);txt(r[1],1515,y,11,r[2],650,'right');if(i<3)ln(1094,y+14,1518,y+14,'#18252a')});
    card(276,654,1264,170,'Planning tools','Reports use real records in the app; this animation uses synthetic demo figures');
    [['Cash-flow forecast','6-month projection'],['Goal forecast','Target-date estimates'],['What-if scenarios','Compare possible outcomes'],['Audit log','Changes and reversals']].forEach((r,i)=>{const x=298+i*310;rr(x,700,286,92,8,'#07080a',C.line);txt(r[0],x+14,728,12,C.ink,650);txt(r[1],x+14,751,10,C.muted,450);txt('Open report  ↗',x+14,775,10,C.blue,650)});
  }
  function drawScene(scene,p,t){
    base(scene,p,t);
    if(scene.nav===0)drawDashboard(p,t);
    else if(scene.nav===2)drawTransactions(p,t);
    else if(scene.nav===1)drawAccounts(p,t);
    else if(scene.nav===3)drawLoans(p,t);
    else if(scene.nav===12)drawTuition(p,t);
    else if(scene.nav===5)drawBudgets(p,t);
    else if(scene.nav===6)drawAssets(p,t);
    else drawReports(p,t);
  }
  function cursor(t,scene,p){
    const from=[1420,132],to=scene.nav===0?[480,247]:scene.nav===2?[95,206]:scene.nav===1?[94,167]:scene.nav===3?[94,245]:scene.nav===12?[96,596]:scene.nav===5?[95,362]:scene.nav===6?[95,401]:[95,595];
    const start=[1420,132],end=to,q=ease((p-.08)/.48);const x=start[0]+(end[0]-start[0])*q+Math.sin(t*2.3)*2,y=start[1]+(end[1]-start[1])*q+Math.cos(t*2)*2;
    ctx.save();ctx.globalAlpha=.92;ctx.translate(x,y);ctx.rotate(-.22);ctx.fillStyle='#e2eef2';ctx.strokeStyle='#07080a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,26);ctx.lineTo(7,19);ctx.lineTo(14,31);ctx.lineTo(19,28);ctx.lineTo(12,16);ctx.lineTo(22,16);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
    if(p>.42&&p<.68){const r=8+Math.sin(t*10)*3;circ(x,y,r,'rgba(37,99,235,.12)','rgba(37,99,235,.6)')}
  }
  function motionOverlay(t,sceneIndex){
    ctx.save();
    const scanX=276+((t*(reduced ? 72 : 158))%1264);
    const beam=ctx.createLinearGradient(scanX-30,0,scanX+30,0);
    beam.addColorStop(0,'rgba(77,212,216,0)');
    beam.addColorStop(.5,'rgba(77,212,216,.09)');
    beam.addColorStop(1,'rgba(77,212,216,0)');
    ctx.fillStyle=beam;ctx.fillRect(scanX-30,190,60,650);
    for(let i=0;i<7;i++){
      const x=276+((t*(reduced ? 34 : 82)+i*191)%1264);
      const y=826+Math.sin(t*2.1+i*1.7)*4;
      ctx.globalAlpha=.35+.35*(.5+.5*Math.sin(t*3+i));
      ctx.strokeStyle=i%3===0?'#d9a84a':'#4dd4d8';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(x-18,y);ctx.lineTo(x+4,y);ctx.stroke();
      ctx.beginPath();ctx.arc(x,y,2.3,0,Math.PI*2);ctx.fillStyle=i%3===0?'#d9a84a':'#4dd4d8';ctx.fill();
    }
    const px=292+((t*(reduced ? 18 : 38))%1200),py=190+((sceneIndex*73)%600);
    ctx.globalAlpha=.16+.12*Math.sin(t*4);
    ctx.strokeStyle='#4dd4d8';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(px,py,7+Math.sin(t*3)*2,0,Math.PI*2);ctx.stroke();
    ctx.restore();
  }
  function draw(){
    const sceneIndex=Math.min(COUNT-1,Math.floor(elapsed/DURATION)),scene=screens[sceneIndex],within=elapsed-sceneIndex*DURATION,p=clamp(within/DURATION);
    drawScene(scene,ease(p),elapsed);
    motionOverlay(elapsed,sceneIndex);
    const progress=(within/DURATION);
    rr(276,868,1264,4,2,'#26363e');rr(276,868,1264*((sceneIndex+progress)/COUNT),4,2,C.blue);
    txt('PRODUCT WALKTHROUGH  ·  '+String(sceneIndex+1).padStart(2,'0')+' / '+COUNT,276,854,9,C.muted,700);
    cursor(within,scene,p);
  }
  function resize(){const dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw()}
  function tick(now){const dt=Math.min((now-last)/1000,.06);last=now;if(playing){elapsed=(elapsed+dt*(reduced ? .35 : 1))%TOTAL;}draw();raf=requestAnimationFrame(tick)}
  document.getElementById('replay').addEventListener('click',()=>{elapsed=0;playing=true;last=performance.now();document.getElementById('pause').textContent='Ⅱ Pause'});
  document.getElementById('pause').addEventListener('click',()=>{playing=!playing;last=performance.now();document.getElementById('pause').textContent=playing?'Ⅱ Pause':'▶ Resume'});
  document.getElementById('download').addEventListener('click',()=>{const out=document.createElement('canvas');out.width=W;out.height=H;const o=out.getContext('2d');o.drawImage(canvas,0,0,W,H);const a=document.createElement('a');a.download='money-calculator-walkthrough-frame.png';a.href=out.toDataURL('image/png');a.click()});
  window.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='r'){elapsed=0;playing=true;}else if(e.code==='Space'&&!/BUTTON|INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();playing=!playing;document.getElementById('pause').textContent=playing?'Ⅱ Pause':'▶ Resume';}});
  resize();raf=requestAnimationFrame(tick)
  window.addEventListener('resize',resize);
})();
</script>
