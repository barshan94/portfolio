<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Money Calculator — Living Financial System</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#07090D; overflow:hidden; }
  #stage { position:fixed; inset:0; }
  canvas { display:block; width:100%; height:100%; }
  .ctl {
    position:fixed; right:14px; bottom:12px; display:flex; gap:7px;
    opacity:.22; transition:opacity .28s ease; z-index:5;
    font:500 10.5px/1 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  .ctl:hover, .ctl:focus-within { opacity:1; }
  .ctl button {
    appearance:none; cursor:pointer; color:#8492A6;
    background:rgba(12,18,26,.72); border:1px solid rgba(86,108,140,.3);
    border-radius:4px; padding:6px 11px; letter-spacing:.06em;
    transition:color .2s, border-color .2s, background .2s;
  }
  .ctl button:hover { color:#EAF0F6; border-color:rgba(57,230,208,.5); background:rgba(14,24,32,.9); }
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>
<div class="ctl">
  <button id="btnPlay" type="button">PAUSE</button>
  <button id="btnReplay" type="button">REPLAY</button>
</div>

<script>
(function () {
  "use strict";

  /* ───────────────────────── CONSTANTS ───────────────────────── */

  var DW = 1600, DH = 900, TAU = Math.PI * 2, LOOP = 24.0;
  var FONT = '"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
  var MONO = 'ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace';

  var C = {
    bg0: "#07090D",
    bg1: "#0D141E",
    cy: [57, 230, 208],
    bl: [100, 140, 255],
    am: [255, 191, 105],
    tx: [234, 240, 246],
    mu: [132, 146, 166],
    ln: [86, 108, 140]
  };

  var cv = document.getElementById("cv");
  var ctx = cv.getContext("2d", { alpha: false });
  var stage = document.getElementById("stage");

  var dpr = 1, cssW = 0, cssH = 0, fitS = 1, fitX = 0, fitY = 0;

  /* ───────────────────────── MATH / UTIL ───────────────────────── */

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function smooth(e0, e1, x) {
    var d = e1 - e0; if (d === 0) d = 1e-6;
    var t = clamp((x - e0) / d, 0, 1);
    return t * t * (3 - 2 * t);
  }
  function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
  function easeIO(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
  function rgba(c, a) { return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")"; }

  function nf(n) {
    n = Math.round(n);
    var neg = n < 0, s = String(Math.abs(n)), out = "", k = 0, i;
    for (i = s.length - 1; i >= 0; i--) {
      out = s.charAt(i) + out; k++;
      if (k % 3 === 0 && i > 0) out = "," + out;
    }
    return (neg ? "-" : "") + out;
  }

  function txt(s, x, y, size, color, align, weight, font) {
    ctx.fillStyle = color;
    ctx.textAlign = align || "left";
    ctx.textBaseline = "alphabetic";
    ctx.font = (weight || 400) + " " + size + "px " + (font || FONT);
    ctx.fillText(s, x, y);
  }

  function rrect(x, y, w, h, r) {
    if (r > h / 2) r = h / 2;
    if (r > w / 2) r = w / 2;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function seg(x1, y1, x2, y2, col, w, dash, off) {
    ctx.beginPath();
    if (dash) { ctx.setLineDash(dash); ctx.lineDashOffset = off || 0; } else ctx.setLineDash([]);
    ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
    ctx.strokeStyle = col; ctx.lineWidth = w || 1; ctx.stroke();
    ctx.setLineDash([]); ctx.lineDashOffset = 0;
  }

  function glow(x, y, r, col, a) {
    if (a <= 0.002 || r <= 0) return;
    var g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, rgba(col, a));
    g.addColorStop(0.55, rgba(col, a * 0.28));
    g.addColorStop(1, rgba(col, 0));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  }

  function qpt(x0, y0, cx, cy, x1, y1, t) {
    var u = 1 - t;
    return {
      x: u * u * x0 + 2 * u * t * cx + t * t * x1,
      y: u * u * y0 + 2 * u * t * cy + t * t * y1
    };
  }
  function qcurve(x0, y0, cx, cy, x1, y1, col, w, dash, off) {
    ctx.beginPath();
    if (dash) { ctx.setLineDash(dash); ctx.lineDashOffset = off || 0; } else ctx.setLineDash([]);
    ctx.moveTo(x0, y0); ctx.quadraticCurveTo(cx, cy, x1, y1);
    ctx.strokeStyle = col; ctx.lineWidth = w || 1; ctx.stroke();
    ctx.setLineDash([]); ctx.lineDashOffset = 0;
  }

  /* ───────────────────────── DEMO DATA (fictional) ───────────────────────── */

  var CORE_X = 720, CORE_Y = 490;

  var ACC = [
    { id: "bank", name: "BANK",    sub: "Current A/C", x: 499, y: 381, base: 248500 },
    { id: "mfs",  name: "MOBILE",  sub: "MFS Wallet",  x: 941, y: 381, base: 32750 },
    { id: "cash", name: "CASH",    sub: "Petty Cash",  x: 499, y: 599, base: 18200 },
    { id: "save", name: "SAVINGS", sub: "Deposit A/C", x: 941, y: 599, base: 410000 }
  ];
  var ACCMAP = {}; (function () { var i; for (i = 0; i < ACC.length; i++) ACCMAP[ACC[i].id] = ACC[i]; })();

  // kind: income | expense | transfer | repayment | deposit
  var EV = [
    { t: 3.0,  kind: "income",    label: "Salary Credited",  amt: 92000, to: "bank",               dr: "Bank",         cr: "Salary Income" },
    { t: 3.9,  kind: "expense",   label: "Grocery & Bills",  amt: 7450,  from: "cash",             dr: "Household Exp",cr: "Cash" },
    { t: 4.8,  kind: "transfer",  label: "Bank to Mobile",   amt: 15000, from: "bank", to: "mfs",  dr: "Mobile",       cr: "Bank" },
    { t: 5.7,  kind: "repayment", label: "Loan Installment", amt: 18000, from: "bank", loan: 18000,dr: "Loan Payable", cr: "Bank" },
    { t: 6.6,  kind: "deposit",   label: "Savings Deposit",  amt: 40000, from: "bank", to: "save", dr: "Savings",      cr: "Bank" },
    { t: 12.2, kind: "income",    label: "Tuition Income",   amt: 26500, to: "mfs",                dr: "Mobile",       cr: "Tuition Income" },
    { t: 13.0, kind: "expense",   label: "Vendor Payment",   amt: 12300, from: "bank",             dr: "Operating Exp",cr: "Bank" },
    { t: 13.8, kind: "transfer",  label: "Mobile to Cash",   amt: 6000,  from: "mfs",  to: "cash", dr: "Cash",         cr: "Mobile" },
    { t: 14.6, kind: "repayment", label: "Equipment Loan",   amt: 9500,  from: "bank", loan: 9500, dr: "Loan Payable", cr: "Bank" },
    { t: 15.4, kind: "deposit",   label: "Fixed Deposit",    amt: 50000, from: "bank", to: "save", dr: "Savings",      cr: "Bank" }
  ];

  var LOAN_BASE = 185000;

  var SAT = [
    { x: 354,  y: 398, name: "LOANS",    val: "157,500 due" },
    { x: 1086, y: 398, name: "TUITION",  val: "26,500 in" },
    { x: 354,  y: 582, name: "BUDGET",   val: "68% used" },
    { x: 1086, y: 582, name: "DEPOSITS", val: "500,000" }
  ];

  var CF_IN  = [86, 92, 78, 95, 101, 118.5];
  var CF_OUT = [52, 47, 61, 49, 44, 47.3];
  var CF_LBL = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN"];

  var SPEND = [
    { name: "Loan Service", v: 27500, c: C.am },
    { name: "Operating",    v: 12300, c: C.bl },
    { name: "Household",    v: 7450,  c: C.cy }
  ];

  var KCOL = { income: C.cy, expense: C.am, transfer: C.bl, repayment: C.am, deposit: C.cy };

  /* timing offsets relative to each event's t */
  var TRAVEL = 1.0, INTAKE_END = 1.75, SETTLE = 1.25, POST = 1.4;

  /* reconciliation windows */
  var REC = [{ a: 10.6, b: 11.45 }, { a: 16.8, b: 17.55 }];

  /* ───────────────────────── DERIVED STATE ───────────────────────── */

  function evRamp(e, t) { return smooth(e.t + SETTLE, e.t + SETTLE + 0.85, t); }

  function accBalance(id, t) {
    var a = ACCMAP[id], v = a.base, i, e, r;
    for (i = 0; i < EV.length; i++) {
      e = EV[i]; r = evRamp(e, t);
      if (r <= 0) continue;
      if (e.from === id) v -= e.amt * r;
      if (e.to === id) v += e.amt * r;
    }
    return v;
  }

  function loanOutstanding(t) {
    var v = LOAN_BASE, i;
    for (i = 0; i < EV.length; i++) if (EV[i].loan) v -= EV[i].loan * evRamp(EV[i], t);
    return v;
  }

  function flows(t) {
    var inn = 0, out = 0, i, e, r;
    for (i = 0; i < EV.length; i++) {
      e = EV[i]; r = evRamp(e, t); if (r <= 0) continue;
      if (e.kind === "income") inn += e.amt * r;
      if (e.kind === "expense" || e.kind === "repayment") out += e.amt * r;
    }
    return { inn: inn, out: out };
  }

  function postedCount(t) {
    var n = 0, i;
    for (i = 0; i < EV.length; i++) n += smooth(EV[i].t + POST, EV[i].t + POST + 0.4, t);
    return n;
  }

  function reconState(t) {
    var i, best = null;
    for (i = 0; i < REC.length; i++) if (t >= REC[i].a) best = REC[i];
    if (!best) return { sweep: -1, done: 0 };
    var p = clamp((t - best.a) / (best.b - best.a), 0, 1);
    var done = smooth(best.b, best.b + 0.45, t) * (1 - smooth(REC[1].a - 0.5, REC[1].a, t) * (best === REC[0] ? 1 : 0));
    return { sweep: p < 1 ? p : -1, done: clamp(done, 0, 1), start: best.a, end: best.b };
  }

  /* ───────────────────────── BACKDROP ───────────────────────── */

  function drawBase() {
    var g = ctx.createRadialGradient(cssW * 0.5, cssH * 0.40, 0, cssW * 0.5, cssH * 0.5, Math.max(cssW, cssH) * 0.78);
    g.addColorStop(0, "#111A24");
    g.addColorStop(0.42, "#0A1018");
    g.addColorStop(1, C.bg0);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, cssW, cssH);
  }

  function drawGrid(t, rev) {
    var i, a, d, x, y;
    // fine architectural grid, revealed outward from the core
    for (x = 0; x <= DW; x += 80) {
      d = Math.abs(x - CORE_X) / 900;
      a = clamp(rev * 1.9 - d, 0, 1) * 0.055;
      if (a > 0.002) seg(x, 0, x, DH, rgba(C.ln, a), 1);
    }
    for (y = 0; y <= DH; y += 80) {
      d = Math.abs(y - CORE_Y) / 620;
      a = clamp(rev * 1.9 - d, 0, 1) * 0.045;
      if (a > 0.002) seg(0, y, DW, y, rgba(C.ln, a), 1);
    }
    // perspective floor
    var vpx = CORE_X, vpy = 322;
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 640, DW, 260); ctx.clip();
    for (i = -6; i <= 22; i++) {
      x = -420 + i * 118;
      a = clamp(rev * 1.6 - Math.abs(x - vpx) / 1700, 0, 1) * 0.07;
      if (a > 0.002) seg(x, 980, vpx, vpy, rgba(C.ln, a), 1);
    }
    for (i = 1; i <= 10; i++) {
      y = 980 - Math.pow(i / 10, 1.9) * 350;
      a = clamp(rev * 1.6 - i / 16, 0, 1) * 0.06;
      if (a > 0.002) seg(0, y, DW, y, rgba(C.ln, a), 1);
    }
    ctx.restore();

    // atmospheric core bloom
    ctx.globalCompositeOperation = "lighter";
    glow(CORE_X, CORE_Y + 20, 430, C.cy, 0.038 * (0.35 + 0.65 * rev));
    glow(CORE_X, CORE_Y - 70, 240, C.bl, 0.026 * (0.35 + 0.65 * rev));
    ctx.globalCompositeOperation = "source-over";
  }

  function drawVignette() {
    var g = ctx.createRadialGradient(cssW / 2, cssH / 2, Math.min(cssW, cssH) * 0.28,
                                     cssW / 2, cssH / 2, Math.max(cssW, cssH) * 0.78);
    g.addColorStop(0, "rgba(0,0,0,0)");
    g.addColorStop(1, "rgba(0,0,0,0.62)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, cssW, cssH);
  }

  /* ───────────────────────── GLYPHS ───────────────────────── */

  function glyph(kind, x, y, s, col, a) {
    ctx.save();
    ctx.strokeStyle = rgba(col, a);
    ctx.fillStyle = rgba(col, a * 0.85);
    ctx.lineWidth = 1.3;
    ctx.lineJoin = "round"; ctx.lineCap = "round";
    if (kind === "income") {
      ctx.beginPath(); ctx.moveTo(x, y - s); ctx.lineTo(x + s * 0.86, y + s * 0.6); ctx.lineTo(x - s * 0.86, y + s * 0.6); ctx.closePath(); ctx.fill();
    } else if (kind === "expense") {
      ctx.beginPath(); ctx.moveTo(x, y + s); ctx.lineTo(x + s * 0.86, y - s * 0.6); ctx.lineTo(x - s * 0.86, y - s * 0.6); ctx.closePath(); ctx.fill();
    } else if (kind === "transfer") {
      ctx.beginPath();
      ctx.moveTo(x - s, y - s * 0.4); ctx.lineTo(x + s, y - s * 0.4);
      ctx.moveTo(x + s * 0.4, y - s * 0.85); ctx.lineTo(x + s, y - s * 0.4);
      ctx.moveTo(x + s, y + s * 0.5); ctx.lineTo(x - s, y + s * 0.5);
      ctx.moveTo(x - s * 0.4, y + s * 0.05); ctx.lineTo(x - s, y + s * 0.5);
      ctx.stroke();
    } else if (kind === "repayment") {
      ctx.beginPath(); ctx.arc(x, y, s * 0.82, Math.PI * 0.28, Math.PI * 1.78); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x - s * 0.1, y - s * 0.95); ctx.lineTo(x - s * 0.82, y - s * 0.5); ctx.lineTo(x - s * 0.12, y - s * 0.16); ctx.closePath(); ctx.fill();
    } else { // deposit
      ctx.beginPath(); ctx.rect(x - s * 0.9, y - s * 0.15, s * 1.8, s * 1.0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x, y - s * 1.1); ctx.lineTo(x, y - s * 0.35);
      ctx.moveTo(x - s * 0.42, y - s * 0.68); ctx.lineTo(x, y - s * 0.3); ctx.lineTo(x + s * 0.42, y - s * 0.68);
      ctx.stroke();
    }
    ctx.restore();
  }

  function tick(x, y, s, col, a, w) {
    ctx.save();
    ctx.strokeStyle = rgba(col, a); ctx.lineWidth = w || 1.6;
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(x - s, y); ctx.lineTo(x - s * 0.25, y + s * 0.72); ctx.lineTo(x + s, y - s * 0.72);
    ctx.stroke();
    ctx.restore();
  }

  function hexPath(x, y, r) {
    var i, a;
    ctx.beginPath();
    for (i = 0; i < 6; i++) {
      a = Math.PI / 6 + i * Math.PI / 3;
      if (i === 0) ctx.moveTo(x + r * Math.cos(a), y + r * Math.sin(a));
      else ctx.lineTo(x + r * Math.cos(a), y + r * Math.sin(a));
    }
    ctx.closePath();
  }

  /* ───────────────────────── HEADER / BRAND ───────────────────────── */

  function drawHeader(t, rev, heroA) {
    var a = (0.9 - 0.75 * heroA) * rev;
    if (a > 0.01) {
      ctx.fillStyle = rgba(C.cy, 0.75 * a);
      ctx.fillRect(60, 88, 3, 14);
      txt("MONEY CALCULATOR", 74, 100, 12.5, rgba(C.tx, 0.86 * a), "left", 700);
      txt("CONNECTED FINANCIAL LEDGER SYSTEM", 74, 117, 9.5, rgba(C.mu, 0.75 * a), "left", 500);
    }
    var pulse = 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(t * 3.1));
    ctx.fillStyle = rgba(C.cy, 0.75 * rev * pulse);
    ctx.beginPath(); ctx.arc(1290, 96, 3, 0, TAU); ctx.fill();
    txt("SIMULATED SYSTEM  ·  DEMO TRANSACTIONS  ·  AMOUNTS IN BDT", 1540, 100, 9.5, rgba(C.mu, 0.62 * rev), "right", 500);
  }

  function drawBrand(heroA) {
    if (heroA <= 0.005) return;
    var y = 828, slide = (1 - heroA) * 14;
    ctx.save();
    ctx.globalAlpha = heroA;
    ctx.fillStyle = rgba(C.cy, 0.9);
    ctx.fillRect(60, y - 31 + slide, 4, 40);
    txt("MONEY CALCULATOR", 78, y + slide, 38, rgba(C.tx, 1), "left", 800);
    txt("One ledger. Connected financial decisions.", 80, y + 27 + slide, 14.5, rgba(C.mu, 0.95), "left", 400);

    var labels = ["TRANSACTION ENGINE", "ACCOUNT SYNCHRONIZATION", "LEDGER INTEGRITY"];
    var x = 80, i;
    for (i = 0; i < labels.length; i++) {
      txt(labels[i], x, y + 52 + slide, 10, rgba(C.cy, 0.62), "left", 600);
      x += ctx.measureText(labels[i]).width + 10;
      if (i < labels.length - 1) {
        txt("·", x, y + 52 + slide, 10, rgba(C.ln, 0.7), "left", 600);
        x += 10;
      }
    }
    ctx.restore();
  }

  function drawTimeline(t, rev) {
    var x0 = 60, x1 = 1540, y = 892, i, bx;
    var marks = [3, 7, 12, 17, 21];
    ctx.globalAlpha = 0.22 * rev;
    seg(x0, y, x1, y, rgba(C.ln, 0.5), 1.5);
    seg(x0, y, x0 + (x1 - x0) * (t / LOOP), y, rgba(C.cy, 0.85), 1.5);
    for (i = 0; i < marks.length; i++) {
      bx = x0 + (x1 - x0) * (marks[i] / LOOP);
      seg(bx, y - 3, bx, y + 3, rgba(C.ln, 0.75), 1);
    }
    ctx.globalAlpha = 1;
  }

  /* ───────────────────────── LAYER A: EVENT RAIL ───────────────────────── */

  function drawRail(t, rev, numA) {
    var railA = rev * (1 - smooth(17.4, 18.6, t)) * (1 - smooth(23.0, 23.7, t));
    railA = clamp(railA, 0, 1);
    if (railA < 0.01) return;

    txt("INCOMING EVENTS", 60, 182, 10, rgba(C.tx, 0.78 * railA), "left", 700);
    txt("UNPROCESSED QUEUE", 60, 197, 8.5, rgba(C.mu, 0.6 * railA), "left", 500);
    seg(60, 208, 300, 208, rgba(C.ln, 0.3 * railA), 1);

    var i, e, d, y, a, col, slot;
    for (i = 0; i < EV.length; i++) {
      e = EV[i]; d = t - e.t;
      if (d < -2.6 || d >= 0) continue;
      slot = i % 5;
      y = 240 + slot * 62;
      a = smooth(-2.6, -1.7, d) * railA;
      col = KCOL[e.kind];

      ctx.fillStyle = rgba(col, 0.75 * a);
      ctx.fillRect(60, y - 13, 2.5, 26);
      glyph(e.kind, 82, y, 6.5, col, 0.85 * a);
      txt(e.label, 100, y + 3.5, 11, rgba(C.tx, 0.85 * a), "left", 500);
      txt(nf(e.amt), 300, y + 3.5, 11, rgba(col, 0.9 * a * numA), "right", 500, MONO);
      txt(e.kind.toUpperCase(), 100, y + 17, 8, rgba(C.mu, 0.55 * a), "left", 600);
      seg(60, y + 26, 300, y + 26, rgba(C.ln, 0.13 * a), 1);
    }

    var idle = railA * (1 - smooth(-0.2, 0.6, Math.min(nextEventGap(t), 1)));
    if (nextEventGap(t) > 1.6) {
      txt("QUEUE IDLE  ·  AWAITING EVENTS", 60, 268, 9.5, rgba(C.mu, 0.35 * railA), "left", 500);
    }
  }

  function nextEventGap(t) {
    var i, best = 99;
    for (i = 0; i < EV.length; i++) if (EV[i].t - t > -2.6 && EV[i].t - t < best) best = EV[i].t - t;
    return best;
  }

  /* ───────────────────────── THE FINANCIAL CORE ───────────────────────── */

  var PLANES = [
    { cy: 580, label: "EVENT INTAKE" },
    { cy: 520, label: "VALIDATION" },
    { cy: 460, label: "LEDGER POSTING" },
    { cy: 400, label: "NET POSITION" }
  ];
  var PW = 330, PD = 165, PH = 13;

  function planePath(cx, cy) {
    ctx.beginPath();
    ctx.moveTo(cx, cy - PD / 2);
    ctx.lineTo(cx + PW / 2, cy);
    ctx.lineTo(cx, cy + PD / 2);
    ctx.lineTo(cx - PW / 2, cy);
    ctx.closePath();
  }

  function activePulse(t) {
    // returns {y, intensity, kind} of ascending transaction pulse, or null
    var i, e, d, p;
    for (i = 0; i < EV.length; i++) {
      e = EV[i]; d = t - e.t;
      if (d >= TRAVEL && d <= INTAKE_END) {
        p = (d - TRAVEL) / (INTAKE_END - TRAVEL);
        return { y: lerp(580, 400, easeIO(p)), k: 1 - Math.abs(p - 0.5) * 0.6, kind: e.kind };
      }
    }
    return null;
  }

  function drawCore(t, rev, numA) {
    var pulse = activePulse(t);
    var i, p, hl, a, col, baseA;

    // shadow pool
    ctx.globalCompositeOperation = "lighter";
    glow(CORE_X, 615, 220, C.cy, 0.07 * rev);
    ctx.globalCompositeOperation = "source-over";

    // bottom-up so upper planes overlay correctly
    for (i = 0; i < PLANES.length; i++) {
      p = PLANES[i];
      hl = pulse ? Math.exp(-Math.pow((pulse.y - p.cy) / 30, 2)) * pulse.k : 0;
      baseA = (0.30 + 0.70 * rev);
      col = pulse && hl > 0.12 ? KCOL[pulse.kind] : C.cy;

      // side faces (extrusion)
      ctx.beginPath();
      ctx.moveTo(CORE_X - PW / 2, p.cy);
      ctx.lineTo(CORE_X, p.cy + PD / 2);
      ctx.lineTo(CORE_X, p.cy + PD / 2 + PH);
      ctx.lineTo(CORE_X - PW / 2, p.cy + PH);
      ctx.closePath();
      ctx.fillStyle = rgba([10, 20, 28], 0.85 * baseA);
      ctx.fill();
      ctx.strokeStyle = rgba(col, (0.14 + 0.5 * hl) * baseA);
      ctx.lineWidth = 1; ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(CORE_X, p.cy + PD / 2);
      ctx.lineTo(CORE_X + PW / 2, p.cy);
      ctx.lineTo(CORE_X + PW / 2, p.cy + PH);
      ctx.lineTo(CORE_X, p.cy + PD / 2 + PH);
      ctx.closePath();
      ctx.fillStyle = rgba([7, 14, 21], 0.85 * baseA);
      ctx.fill();
      ctx.strokeStyle = rgba(col, (0.10 + 0.42 * hl) * baseA);
      ctx.lineWidth = 1; ctx.stroke();

      // top face
      planePath(CORE_X, p.cy);
      var g = ctx.createLinearGradient(CORE_X - PW / 2, p.cy - PD / 2, CORE_X + PW / 2, p.cy + PD / 2);
      g.addColorStop(0, rgba(col, (0.035 + 0.16 * hl) * baseA));
      g.addColorStop(0.5, rgba(col, (0.015 + 0.09 * hl) * baseA));
      g.addColorStop(1, rgba(col, (0.04 + 0.14 * hl) * baseA));
      ctx.fillStyle = g; ctx.fill();
      ctx.strokeStyle = rgba(col, (0.26 + 0.6 * hl) * baseA);
      ctx.lineWidth = 1.1; ctx.stroke();

      // inner lattice on the top face
      var j, f;
      for (j = 1; j <= 3; j++) {
        f = j / 4;
        ctx.beginPath();
        ctx.moveTo(CORE_X - PW / 2 + (PW / 2) * f, p.cy - (PD / 2) * f);
        ctx.lineTo(CORE_X + (PW / 2) * f, p.cy + (PD / 2) * f);
        ctx.strokeStyle = rgba(col, (0.05 + 0.16 * hl) * baseA);
        ctx.lineWidth = 0.7; ctx.stroke();
      }

      // stage label
      a = (0.42 + 0.58 * hl) * baseA;
      txt(p.label, CORE_X, p.cy + 4, 9.5, rgba(hl > 0.2 ? C.tx : C.mu, a), "center", 700);

      // completion tick on the east vertex once events have passed this stage
      var passed = smooth(0, 1, postedCount(t) * 0.35 + (i < 3 ? 0.4 : 0));
      if (postedCount(t) > 0.5) tick(CORE_X + PW / 2 - 16, p.cy - 1, 4, C.cy, 0.3 * baseA * passed, 1.3);
    }

    // central light column
    var cg = ctx.createLinearGradient(0, 600, 0, 390);
    cg.addColorStop(0, rgba(C.cy, 0.04 * rev));
    cg.addColorStop(0.5, rgba(C.cy, 0.16 * rev));
    cg.addColorStop(1, rgba(C.cy, 0.02 * rev));
    ctx.fillStyle = cg;
    ctx.fillRect(CORE_X - 1, 390, 2, 210);

    if (pulse) {
      ctx.globalCompositeOperation = "lighter";
      glow(CORE_X, pulse.y, 44, KCOL[pulse.kind], 0.45 * pulse.k);
      ctx.globalCompositeOperation = "source-over";
      ctx.fillStyle = rgba(KCOL[pulse.kind], 0.95);
      ctx.beginPath(); ctx.arc(CORE_X, pulse.y, 3.4, 0, TAU); ctx.fill();
    }

    // ───── headline: available balance ─────
    var liquid = accBalance("bank", t) + accBalance("cash", t) + accBalance("mfs", t);
    txt("AVAILABLE BALANCE  ·  LIQUID ACCOUNTS", CORE_X, 163, 10, rgba(C.mu, 0.75 * rev), "center", 600);
    ctx.save();
    ctx.globalAlpha = numA * rev;
    txt("BDT", CORE_X - 118, 206, 14, rgba(C.mu, 0.8), "right", 600, MONO);
    txt(nf(liquid), CORE_X - 104, 210, 40, rgba(C.am, 0.97), "left", 700, MONO);
    ctx.restore();

    // recent delta chip
    var i2, e2, d2, bestA = 0, bestE = null;
    for (i2 = 0; i2 < EV.length; i2++) {
      e2 = EV[i2]; d2 = t - (e2.t + SETTLE);
      if (d2 >= 0 && d2 < 1.6) {
        var aa = (1 - d2 / 1.6);
        if (aa > bestA) { bestA = aa; bestE = e2; }
      }
    }
    if (bestE && bestE.kind !== "transfer" && bestE.kind !== "deposit") {
      var sgn = bestE.kind === "income" ? "+" : "-";
      txt(sgn + nf(bestE.amt), CORE_X + 196, 196, 13, rgba(KCOL[bestE.kind], 0.85 * bestA * numA), "left", 600, MONO);
    }

    // sync ticks
    var synced = 0, k;
    for (k = 0; k < 4; k++) synced += smooth(1.1 + k * 0.32, 1.5 + k * 0.32, t);
    var sx = CORE_X - 72;
    txt("ACCOUNT SYNC", sx - 6, 236, 9, rgba(C.mu, 0.62 * rev), "right", 600);
    for (k = 0; k < 4; k++) {
      var on = clamp(synced - k, 0, 1);
      ctx.fillStyle = rgba(on > 0.5 ? C.cy : C.ln, (0.22 + 0.68 * on) * rev);
      ctx.fillRect(sx + 4 + k * 13, 230, 9, 3);
    }
    txt(Math.round(synced) + " / 4", sx + 62, 236, 9, rgba(C.cy, 0.7 * rev), "left", 600, MONO);

    // reconciliation badge
    var rs = reconState(t);
    var rA = rs.done * rev * numA;
    if (rA > 0.01) {
      var bx = CORE_X + 10, by = 228;
      tick(bx + 6, by - 4, 4.5, C.cy, 0.9 * rA, 1.6);
      txt("LEDGER RECONCILED", bx + 18, by, 9.5, rgba(C.cy, 0.9 * rA), "left", 700);
      txt("ENTRIES BALANCED", bx + 18, by + 12, 8.5, rgba(C.mu, 0.62 * rA), "left", 500);
    }
  }

  /* ───────────────────────── LAYER C: ACCOUNTS ───────────────────────── */

  function accPulse(a, t) {
    var i, e, d, best = 0, bestCol = C.cy;
    for (i = 0; i < EV.length; i++) {
      e = EV[i];
      if (e.from !== a.id && e.to !== a.id) continue;
      d = t - (e.t + SETTLE);
      if (d >= 0 && d < 1.0) {
        var v = 1 - d / 1.0;
        if (v > best) { best = v; bestCol = e.to === a.id ? C.cy : C.am; }
      }
    }
    return { v: best, col: bestCol };
  }

  function drawAccounts(t, rev, numA) {
    var i, a, p, r = 34, bal, dashOff = -(t * 26) % 18;

    // links to core
    for (i = 0; i < ACC.length; i++) {
      a = ACC[i]; p = accPulse(a, t);
      var mx = (a.x + CORE_X) / 2 + (a.x < CORE_X ? -22 : 22);
      var my = (a.y + CORE_Y) / 2 + (a.y < CORE_Y ? -16 : 16);
      qcurve(a.x, a.y, mx, my, CORE_X, CORE_Y, rgba(C.ln, (0.16 + 0.3 * p.v) * rev), 1, [4, 14], dashOff);
    }

    for (i = 0; i < ACC.length; i++) {
      a = ACC[i]; p = accPulse(a, t);
      var fade = smooth(0.5 + i * 0.16, 1.4 + i * 0.16, t) * rev;

      if (p.v > 0.02) {
        ctx.globalCompositeOperation = "lighter";
        glow(a.x, a.y, 70 + 26 * p.v, p.col, 0.3 * p.v);
        ctx.globalCompositeOperation = "source-over";
        ctx.strokeStyle = rgba(p.col, 0.42 * p.v);
        ctx.lineWidth = 1.2;
        hexPath(a.x, a.y, r + 12 + 20 * (1 - p.v)); ctx.stroke();
      }

      hexPath(a.x, a.y, r);
      var g = ctx.createLinearGradient(a.x - r, a.y - r, a.x + r, a.y + r);
      g.addColorStop(0, rgba([16, 26, 36], 0.92 * fade));
      g.addColorStop(1, rgba([9, 15, 22], 0.92 * fade));
      ctx.fillStyle = g; ctx.fill();
      ctx.strokeStyle = rgba(p.v > 0.1 ? p.col : C.cy, (0.34 + 0.52 * p.v) * fade);
      ctx.lineWidth = 1.2; ctx.stroke();

      hexPath(a.x, a.y, r - 9);
      ctx.strokeStyle = rgba(C.ln, 0.22 * fade); ctx.lineWidth = 0.8; ctx.stroke();
      ctx.fillStyle = rgba(C.cy, (0.22 + 0.5 * p.v) * fade);
      ctx.beginPath(); ctx.arc(a.x, a.y, 3.2, 0, TAU); ctx.fill();

      txt(a.name, a.x, a.y + 55, 11, rgba(C.tx, 0.9 * fade), "center", 700);
      txt(a.sub, a.x, a.y + 68, 8.5, rgba(C.mu, 0.6 * fade), "center", 500);
      bal = accBalance(a.id, t);
      txt(nf(bal), a.x, a.y + 86, 13.5, rgba(C.am, 0.92 * fade * numA), "center", 600, MONO);
    }
  }

  /* ───────────────────────── SATELLITES (scene 4) ───────────────────────── */

  function drawSatellites(t, rev, numA) {
    var i, s, a, r = 21, dash = -(t * 18) % 16;
    for (i = 0; i < SAT.length; i++) {
      s = SAT[i];
      a = smooth(11.6 + i * 0.3, 12.8 + i * 0.3, t) * rev * (1 - smooth(23.0, 23.7, t));
      if (a < 0.01) continue;
      qcurve(s.x, s.y, (s.x + CORE_X) / 2, (s.y + CORE_Y) / 2 + (s.y < CORE_Y ? -30 : 30),
             CORE_X, CORE_Y, rgba(C.bl, 0.18 * a), 1, [3, 11], dash);
      hexPath(s.x, s.y, r);
      ctx.fillStyle = rgba([12, 20, 29], 0.9 * a); ctx.fill();
      ctx.strokeStyle = rgba(C.bl, 0.4 * a); ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = rgba(C.bl, 0.5 * a);
      ctx.beginPath(); ctx.arc(s.x, s.y, 2.4, 0, TAU); ctx.fill();
      txt(s.name, s.x, s.y + 38, 9.5, rgba(C.tx, 0.78 * a), "center", 700);
      txt(s.val, s.x, s.y + 51, 9, rgba(C.mu, 0.65 * a * numA), "center", 500, MONO);
    }
  }

  /* ───────────────────────── FLOWS + NET POSITION ───────────────────────── */

  function drawFlows(t, rev, numA) {
    var f = flows(t), MAXF = 130000;
    var a = rev * numA;
    var x0 = 560, bx = 640, bw = 200, vx = 900;

    txt("INFLOW", x0, 713, 9.5, rgba(C.mu, 0.7 * rev), "left", 600);
    ctx.fillStyle = rgba(C.ln, 0.18 * rev); ctx.fillRect(bx, 707, bw, 5);
    ctx.fillStyle = rgba(C.cy, 0.8 * rev); ctx.fillRect(bx, 707, bw * clamp(f.inn / MAXF, 0, 1), 5);
    txt(nf(f.inn), vx, 714, 11.5, rgba(C.cy, 0.92 * a), "right", 600, MONO);

    txt("OUTFLOW", x0, 739, 9.5, rgba(C.mu, 0.7 * rev), "left", 600);
    ctx.fillStyle = rgba(C.ln, 0.18 * rev); ctx.fillRect(bx, 733, bw, 5);
    ctx.fillStyle = rgba(C.am, 0.8 * rev); ctx.fillRect(bx, 733, bw * clamp(f.out / MAXF, 0, 1), 5);
    txt(nf(f.out), vx, 740, 11.5, rgba(C.am, 0.92 * a), "right", 600, MONO);

    seg(x0, 750, vx, 750, rgba(C.ln, 0.2 * rev), 1);

    var total = accBalance("bank", t) + accBalance("cash", t) + accBalance("mfs", t) + accBalance("save", t);
    var net = total - loanOutstanding(t);
    txt("NET POSITION", x0, 771, 10, rgba(C.tx, 0.8 * rev), "left", 700);
    txt("BDT " + nf(net), vx, 773, 15, rgba(C.tx, 0.96 * a), "right", 700, MONO);
  }

  /* ───────────────────────── LAYER D: LEDGER ───────────────────────── */

  function drawLedger(t, rev, numA) {
    var panelA = rev * (1 - smooth(23.0, 23.7, t));
    if (panelA < 0.01) return;
    var LX = 1120, TOP = 150, BOT = 520, rowH = 30, listBottom = 496;

    seg(LX, TOP, LX, BOT, rgba(C.ln, 0.26 * panelA), 1);
    txt("GENERAL LEDGER", LX + 14, TOP + 26, 10.5, rgba(C.tx, 0.85 * panelA), "left", 700);
    txt("DOUBLE ENTRY", 1540, TOP + 26, 9, rgba(C.mu, 0.6 * panelA), "right", 600);
    seg(LX + 14, TOP + 36, 1540, TOP + 36, rgba(C.ln, 0.22 * panelA), 1);

    var cnt = postedCount(t);
    var rs = reconState(t);
    var sweepY = rs.sweep >= 0 ? lerp(TOP + 44, listBottom + 8, rs.sweep) : -1;

    ctx.save();
    ctx.beginPath(); ctx.rect(LX, TOP + 40, 1545 - LX, listBottom + 12 - (TOP + 40)); ctx.clip();

    var i, e, s, y, a, col, sgn;
    for (i = 0; i < EV.length; i++) {
      e = EV[i]; s = e.t + POST;
      if (t < s) continue;
      a = smooth(s, s + 0.4, t) * panelA * numA;
      y = listBottom - rowH * (cnt - 1 - i);
      y += (1 - smooth(s, s + 0.4, t)) * 16;
      if (y < TOP + 30 || y > listBottom + 40) continue;
      col = KCOL[e.kind];

      ctx.fillStyle = rgba(col, 0.6 * a);
      ctx.fillRect(LX + 14, y - 10, 2, 20);
      txt(("0" + (i + 1)).slice(-2), LX + 24, y - 1, 9, rgba(C.mu, 0.55 * a), "left", 600, MONO);
      txt(e.label, LX + 46, y - 1, 11, rgba(C.tx, 0.88 * a), "left", 500);
      sgn = (e.kind === "income") ? "+" : (e.kind === "expense" || e.kind === "repayment") ? "-" : "";
      txt(sgn + nf(e.amt), 1540, y - 1, 11.5, rgba(col, 0.92 * a), "right", 600, MONO);
      txt("DR " + e.dr + "   ·   CR " + e.cr, LX + 46, y + 11, 8.5, rgba(C.mu, 0.62 * a), "left", 500);

      var checked = (rs.sweep < 0 && t > (rs.end || 0)) || (sweepY > y);
      if (checked && t > s + 0.3) tick(1507, y + 9, 3.4, C.cy, 0.55 * a, 1.3);
    }

    if (sweepY > 0) {
      ctx.globalCompositeOperation = "lighter";
      var g = ctx.createLinearGradient(LX, sweepY - 14, LX, sweepY + 14);
      g.addColorStop(0, rgba(C.cy, 0));
      g.addColorStop(0.5, rgba(C.cy, 0.22 * panelA));
      g.addColorStop(1, rgba(C.cy, 0));
      ctx.fillStyle = g; ctx.fillRect(LX + 10, sweepY - 14, 1535 - LX, 28);
      ctx.globalCompositeOperation = "source-over";
      seg(LX + 10, sweepY, 1542, sweepY, rgba(C.cy, 0.6 * panelA), 1);
    }
    ctx.restore();

    var eCount = Math.round(cnt);
    txt("ENTRIES " + eCount + " / " + EV.length, LX + 14, BOT - 2, 9, rgba(C.mu, 0.55 * panelA * numA), "left", 600, MONO);
    txt(rs.done > 0.5 ? "RECONCILED" : (rs.sweep >= 0 ? "RECONCILING" : "POSTING"), 1540, BOT - 2, 9,
        rgba(rs.done > 0.5 ? C.cy : C.mu, 0.7 * panelA), "right", 700);
  }

  /* ───────────────────────── LAYER E: INTELLIGENCE ───────────────────────── */

  function drawIntel(t, rev, numA) {
    var appear = smooth(17.1, 18.1, t) * rev * (1 - smooth(23.0, 23.7, t));
    if (appear < 0.01) return;

    var LX = 1120, TOP = 545, BOT = 866;
    seg(LX, TOP, LX, BOT, rgba(C.ln, 0.26 * appear), 1);
    txt("FINANCIAL INTELLIGENCE", LX + 14, TOP + 26, 10.5, rgba(C.tx, 0.85 * appear), "left", 700);
    txt("DERIVED FROM LEDGER", 1540, TOP + 26, 9, rgba(C.mu, 0.6 * appear), "right", 600);
    seg(LX + 14, TOP + 36, 1540, TOP + 36, rgba(C.ln, 0.22 * appear), 1);

    /* cash-flow */
    var cx0 = LX + 30, cy0 = 600, cw = 390, ch = 86, maxV = 130;
    var pr1 = smooth(17.4, 19.3, t);
    var i, px, py, gx;

    for (i = 0; i <= 2; i++) {
      gx = cy0 + ch - (ch * i / 2);
      seg(cx0, gx, cx0 + cw, gx, rgba(C.ln, 0.12 * appear), 1);
    }

    ctx.save();
    ctx.beginPath(); ctx.rect(cx0 - 2, cy0 - 14, cw * pr1 + 4, ch + 34); ctx.clip();

    // inflow area
    ctx.beginPath();
    ctx.moveTo(cx0, cy0 + ch);
    for (i = 0; i < CF_IN.length; i++) {
      px = cx0 + cw * (i / (CF_IN.length - 1));
      py = cy0 + ch - ch * (CF_IN[i] / maxV);
      ctx.lineTo(px, py);
    }
    ctx.lineTo(cx0 + cw, cy0 + ch); ctx.closePath();
    var ag = ctx.createLinearGradient(0, cy0, 0, cy0 + ch);
    ag.addColorStop(0, rgba(C.cy, 0.22 * appear));
    ag.addColorStop(1, rgba(C.cy, 0.01 * appear));
    ctx.fillStyle = ag; ctx.fill();

    ctx.beginPath();
    for (i = 0; i < CF_IN.length; i++) {
      px = cx0 + cw * (i / (CF_IN.length - 1));
      py = cy0 + ch - ch * (CF_IN[i] / maxV);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.strokeStyle = rgba(C.cy, 0.9 * appear); ctx.lineWidth = 1.8; ctx.stroke();

    // outflow line
    ctx.beginPath();
    ctx.setLineDash([5, 4]);
    for (i = 0; i < CF_OUT.length; i++) {
      px = cx0 + cw * (i / (CF_OUT.length - 1));
      py = cy0 + ch - ch * (CF_OUT[i] / maxV);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.strokeStyle = rgba(C.am, 0.8 * appear); ctx.lineWidth = 1.5; ctx.stroke();
    ctx.setLineDash([]);

    for (i = 0; i < CF_IN.length; i++) {
      px = cx0 + cw * (i / (CF_IN.length - 1));
      py = cy0 + ch - ch * (CF_IN[i] / maxV);
      ctx.fillStyle = rgba(C.cy, 0.95 * appear);
      ctx.beginPath(); ctx.arc(px, py, 2.1, 0, TAU); ctx.fill();
      txt(CF_LBL[i], px, cy0 + ch + 16, 8, rgba(C.mu, 0.55 * appear), "center", 600, MONO);
    }
    ctx.restore();

    txt("CASH FLOW  ·  6 PERIODS  ·  THOUSANDS", cx0, cy0 - 12, 9, rgba(C.mu, 0.62 * appear), "left", 600);
    ctx.fillStyle = rgba(C.cy, 0.85 * appear); ctx.fillRect(1448, cy0 - 16, 9, 2);
    txt("IN", 1462, cy0 - 12, 8.5, rgba(C.mu, 0.7 * appear), "left", 600);
    ctx.fillStyle = rgba(C.am, 0.85 * appear); ctx.fillRect(1484, cy0 - 16, 9, 2);
    txt("OUT", 1498, cy0 - 12, 8.5, rgba(C.mu, 0.7 * appear), "left", 600);

    /* spending ring */
    var rx = 1192, ry = 772, rr0 = 40, thick = 12;
    var pr2 = smooth(18.5, 20.1, t);
    var total = 0;
    for (i = 0; i < SPEND.length; i++) total += SPEND[i].v;
    var ang = -Math.PI / 2, sw;

    ctx.lineWidth = thick; ctx.lineCap = "butt";
    ctx.beginPath(); ctx.arc(rx, ry, rr0, 0, TAU);
    ctx.strokeStyle = rgba(C.ln, 0.14 * appear); ctx.stroke();

    for (i = 0; i < SPEND.length; i++) {
      sw = TAU * (SPEND[i].v / total) * pr2;
      ctx.beginPath();
      ctx.arc(rx, ry, rr0, ang, ang + sw);
      ctx.strokeStyle = rgba(SPEND[i].c, 0.85 * appear);
      ctx.stroke();
      ang += TAU * (SPEND[i].v / total);
    }
    ctx.lineCap = "butt";
    txt("OUTFLOW", rx, ry - 4, 8.5, rgba(C.mu, 0.65 * appear), "center", 600);
    txt(nf(total * pr2), rx, ry + 12, 13, rgba(C.tx, 0.93 * appear * numA), "center", 700, MONO);

    for (i = 0; i < SPEND.length; i++) {
      var ly = 748 + i * 24;
      ctx.fillStyle = rgba(SPEND[i].c, 0.85 * appear);
      ctx.fillRect(1256, ly - 7, 8, 8);
      txt(SPEND[i].name, 1272, ly, 10, rgba(C.tx, 0.82 * appear), "left", 500);
      txt(nf(SPEND[i].v), 1420, ly, 10, rgba(C.mu, 0.8 * appear * numA), "right", 500, MONO);
      txt(Math.round(SPEND[i].v / total * 100) + "%", 1470, ly, 10, rgba(SPEND[i].c, 0.85 * appear), "right", 600, MONO);
    }

    /* bottom readouts */
    var pr3 = smooth(19.4, 20.6, t) * appear * numA;
    seg(LX + 14, 822, 1540, 822, rgba(C.ln, 0.2 * appear), 1);
    var loan = loanOutstanding(t);
    var totalAssets = accBalance("bank", t) + accBalance("cash", t) + accBalance("mfs", t) + accBalance("save", t);
    var inn = flows(t).inn, out = flows(t).out;
    var rate = inn > 0 ? Math.round((inn - out) / inn * 100) : 0;

    txt("OUTSTANDING LOANS", LX + 14, 842, 8.5, rgba(C.mu, 0.65 * appear), "left", 600);
    txt(nf(loan), LX + 14, 860, 13, rgba(C.am, 0.92 * pr3), "left", 700, MONO);

    txt("TOTAL ASSETS", 1310, 842, 8.5, rgba(C.mu, 0.65 * appear), "left", 600);
    txt(nf(totalAssets), 1310, 860, 13, rgba(C.tx, 0.92 * pr3), "left", 700, MONO);

    txt("SAVINGS RATE", 1540, 842, 8.5, rgba(C.mu, 0.65 * appear), "right", 600);
    txt(rate + "%", 1540, 860, 13, rgba(C.cy, 0.92 * pr3), "right", 700, MONO);
  }

  /* ───────────────────────── MOVING EVENTS ───────────────────────── */

  function travelToken(e, t) {
    var d = t - e.t;
    if (d < 0 || d > TRAVEL) return;
    var slot = (EV.indexOf(e)) % 5;
    var y0 = 240 + slot * 62, x0 = 190;
    var p = easeIO(clamp(d / TRAVEL, 0, 1));
    var pt = qpt(x0, y0, 470, lerp(y0, 560, 0.55), CORE_X, 580, p);
    var col = KCOL[e.kind];
    var fade = smooth(0, 0.08, d) * (1 - smooth(0.9, 1.0, d) * 0.35);

    // trailing path
    ctx.save();
    ctx.globalAlpha = 0.35 * fade;
    qcurve(x0, y0, 470, lerp(y0, 560, 0.55), pt.x, pt.y, rgba(col, 0.34), 1, [3, 7], -(t * 40) % 10);
    ctx.restore();

    ctx.globalCompositeOperation = "lighter";
    glow(pt.x, pt.y, 40, col, 0.32 * fade);
    ctx.globalCompositeOperation = "source-over";

    var w = 104, h = 24;
    rrect(pt.x - w / 2, pt.y - h / 2, w, h, 12);
    ctx.fillStyle = rgba([10, 17, 25], 0.92 * fade); ctx.fill();
    ctx.strokeStyle = rgba(col, 0.62 * fade); ctx.lineWidth = 1; ctx.stroke();
    glyph(e.kind, pt.x - w / 2 + 15, pt.y, 5.4, col, 0.95 * fade);
    txt(nf(e.amt), pt.x + w / 2 - 11, pt.y + 4, 11, rgba(C.tx, 0.92 * fade), "right", 600, MONO);
  }

  function valueDots(e, t) {
    var d = t - e.t, col, pt, p;
    // debit leg: source account -> core
    if (e.from) {
      p = clamp((d - 0.72) / 0.42, 0, 1);
      if (p > 0 && p < 1) {
        var fa = ACCMAP[e.from];
        pt = qpt(fa.x, fa.y, (fa.x + CORE_X) / 2 + (fa.x < CORE_X ? -22 : 22),
                 (fa.y + CORE_Y) / 2 + (fa.y < CORE_Y ? -16 : 16), CORE_X, CORE_Y, easeIO(p));
        col = C.am;
        ctx.globalCompositeOperation = "lighter";
        glow(pt.x, pt.y, 22, col, 0.5 * Math.sin(p * Math.PI));
        ctx.globalCompositeOperation = "source-over";
        ctx.fillStyle = rgba(col, 0.95); ctx.beginPath(); ctx.arc(pt.x, pt.y, 2.8, 0, TAU); ctx.fill();
      }
    }
    // credit leg: core -> destination account
    if (e.to) {
      p = clamp((d - 1.05) / 0.45, 0, 1);
      if (p > 0 && p < 1) {
        var ta = ACCMAP[e.to];
        pt = qpt(CORE_X, CORE_Y, (ta.x + CORE_X) / 2 + (ta.x < CORE_X ? -22 : 22),
                 (ta.y + CORE_Y) / 2 + (ta.y < CORE_Y ? -16 : 16), ta.x, ta.y, easeIO(p));
        col = C.cy;
        ctx.globalCompositeOperation = "lighter";
        glow(pt.x, pt.y, 22, col, 0.5 * Math.sin(p * Math.PI));
        ctx.globalCompositeOperation = "source-over";
        ctx.fillStyle = rgba(col, 0.95); ctx.beginPath(); ctx.arc(pt.x, pt.y, 2.8, 0, TAU); ctx.fill();
      }
    }
    // posting beam: core -> ledger panel
    p = clamp((d - 1.3) / 0.5, 0, 1);
    if (p > 0 && p < 1) {
      pt = qpt(CORE_X + 60, 430, 1040, 330, 1134, 330, easeIO(p));
      ctx.fillStyle = rgba(C.bl, 0.9 * Math.sin(p * Math.PI));
      ctx.beginPath(); ctx.arc(pt.x, pt.y, 2.4, 0, TAU); ctx.fill();
      ctx.globalCompositeOperation = "lighter";
      glow(pt.x, pt.y, 18, C.bl, 0.35 * Math.sin(p * Math.PI));
      ctx.globalCompositeOperation = "source-over";
    }
  }

  function drawEvents(t) {
    var i, e;
    for (i = 0; i < EV.length; i++) {
      e = EV[i];
      travelToken(e, t);
      valueDots(e, t);
    }
  }

  /* ───────────────────────── FRAME ───────────────────────── */

  function render(t, cycle) {
    // continuous loop envelope: 0 at both seam ends, 1 in between
    var rev = smooth(0.10, 1.90, t) * (1 - smooth(23.10, 23.96, t));
    rev = clamp(0.30 + 0.70 * rev, 0, 1);
    var cold = cycle === 0 ? smooth(0.15, 2.40, t) : 1;
    var numA = smooth(0.40, 1.15, t) * (1 - smooth(22.90, 23.60, t));
    var heroA = smooth(20.80, 21.80, t) * (1 - smooth(23.30, 23.95, t));

    // camera (strictly periodic over LOOP so the loop is seamless)
    var ph = TAU * t / LOOP;
    var camX = 7 * Math.sin(ph) + 4 * Math.sin(2 * ph);
    var camY = -5 + 5 * Math.cos(ph);
    var camZ = 1 + 0.016 * (1 - Math.cos(ph)) / 2
                 + 0.016 * smooth(12, 17.5, t) * (1 - smooth(21.5, 23.9, t));

    drawBase();

    ctx.save();
    ctx.setTransform(dpr * fitS, 0, 0, dpr * fitS, fitX * dpr, fitY * dpr);
    ctx.globalAlpha = cold;

    // background plate (slow parallax)
    ctx.save();
    ctx.translate(CORE_X + camX * 0.35, CORE_Y + camY * 0.35);
    ctx.scale(1 + (camZ - 1) * 0.4, 1 + (camZ - 1) * 0.4);
    ctx.translate(-CORE_X, -CORE_Y);
    drawGrid(t, rev);
    ctx.restore();

    // world layer
    ctx.save();
    ctx.translate(CORE_X + camX, CORE_Y + camY);
    ctx.scale(camZ, camZ);
    ctx.translate(-CORE_X, -CORE_Y);
    drawSatellites(t, rev, numA);
    drawCore(t, rev, numA);
    drawAccounts(t, rev, numA);
    drawEvents(t);
    drawFlows(t, rev, numA);
    ctx.restore();

    // side panels (reduced parallax so text stays crisp and readable)
    ctx.save();
    ctx.translate(camX * 0.3, camY * 0.3);
    drawRail(t, rev, numA);
    drawLedger(t, rev, numA);
    drawIntel(t, rev, numA);
    ctx.restore();

    drawHeader(t, rev, heroA);
    drawBrand(heroA);
    drawTimeline(t, rev);

    ctx.globalAlpha = 1;
    ctx.restore();

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawVignette();
  }

  /* ───────────────────────── LOOP / LIFECYCLE ───────────────────────── */

  var reduced = false;
  try {
    reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  } catch (err) { reduced = false; }

  var rafId = 0, running = false, startMs = 0, pausedAt = 0, cycleIdx = 0;
  var SPEED = reduced ? 0.45 : 1.0;

  function nowS() { return (typeof performance !== "undefined" ? performance.now() : Date.now()) / 1000; }

  function frame() {
    rafId = window.requestAnimationFrame(frame);
    var el = (nowS() - startMs) * SPEED;
    cycleIdx = Math.floor(el / LOOP);
    render(el - cycleIdx * LOOP, cycleIdx);
  }

  function start() {
    if (running) return;
    running = true;
    startMs = nowS() - pausedAt / SPEED;
    if (!rafId) rafId = window.requestAnimationFrame(frame);
    btnPlay.textContent = "PAUSE";
  }

  function stop() {
    if (!running) return;
    pausedAt = (nowS() - startMs) * SPEED;
    running = false;
    if (rafId) { window.cancelAnimationFrame(rafId); rafId = 0; }
    btnPlay.textContent = "PLAY";
  }

  function resize() {
    var r = stage.getBoundingClientRect();
    cssW = Math.max(1, Math.round(r.width));
    cssH = Math.max(1, Math.round(r.height));
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(cssW * dpr);
    cv.height = Math.round(cssH * dpr);
    cv.style.width = cssW + "px";
    cv.style.height = cssH + "px";
    fitS = Math.min(cssW / DW, cssH / DH);
    fitX = (cssW - DW * fitS) / 2;
    fitY = (cssH - DH * fitS) / 2;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (!running) {
      var el = reduced ? 21.6 : pausedAt;
      render(el % LOOP, 1);
    }
  }

  var btnPlay = document.getElementById("btnPlay");
  var btnReplay = document.getElementById("btnReplay");

  btnPlay.addEventListener("click", function () { if (running) stop(); else start(); });
  btnReplay.addEventListener("click", function () {
    pausedAt = 0; cycleIdx = 0;
    startMs = nowS();
    if (!running) { running = true; if (!rafId) rafId = window.requestAnimationFrame(frame); btnPlay.textContent = "PAUSE"; }
  });

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { if (running) { stop(); pausedAt = pausedAt; btnPlay.textContent = "PLAY"; } }
    else if (!reduced && btnPlay.textContent === "PLAY" && pausedAt > 0) { start(); }
  });

  window.addEventListener("resize", resize);
  if (typeof ResizeObserver !== "undefined") {
    try { new ResizeObserver(resize).observe(stage); } catch (err2) { /* no-op */ }
  }
  window.addEventListener("pagehide", stop);

  resize();
  if (reduced) {
    pausedAt = 21.6;
    render(21.6, 1);
    btnPlay.textContent = "PLAY";
  } else {
    start();
  }
})();
</script>
</body>
</html>
