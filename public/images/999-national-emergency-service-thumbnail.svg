    .subtitle{font-size:15px;font-weight:500;fill:#9ba9bc}
    .copy{font-size:13px;fill:#aab7c8}
    .section{font-size:12px;font-weight:700;fill:#e1e9f3;letter-spacing:1px}
    .card-title{font-size:11px;font-weight:650;fill:#dbe4ef}
