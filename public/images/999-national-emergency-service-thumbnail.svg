<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">999 National Emergency Service — project thumbnail</title>
<desc id="desc">A dark emergency-service application concept showing nine service categories, NID sign-in, illustrative request records, active-session monitoring, admin tools, and an application-flow diagram. This is a portfolio illustration, not a live system.</desc>
