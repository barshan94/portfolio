<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Money Calculator financial dashboard</title>
<desc id="desc">A static dark financial dashboard with account balances, ledger entries, cash flow and net position.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080d14"/><stop offset="1" stop-color="#101b29"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#39e6d0"/><stop offset="1" stop-color="#6f9cff"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#39e6d0" stop-opacity=".14"/><stop offset="1" stop-color="#39e6d0" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#26364a" stroke-opacity=".38"/></pattern>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".28"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/><circle cx="800" cy="420" r="490" fill="url(#halo)"/>
