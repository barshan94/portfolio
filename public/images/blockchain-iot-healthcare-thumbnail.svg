 <text x="803" y="642" fill="#eaf5ff" font-size="14" font-weight="700">Integrity &amp; audit</text><text x="765" y="671" fill="#aab8d0" font-size="12">Detect record alteration</text>
 <rect x="974" y="610" width="206" height="94" rx="12" fill="#332b1c" stroke="#f4c66a" stroke-opacity=".55"/>
 <rect x="995" y="628" width="18" height="18" rx="3" fill="none" stroke="#f4c66a" stroke-width="2"/><path d="M1000 628v-5a4 4 0 0 1 8 0v5" fill="none" stroke="#f4c66a" stroke-width="2"/>
 <text x="1022" y="642" fill="#eaf5ff" font-size="14" font-weight="700">Privacy &amp; compliance</text><text x="992" y="671" fill="#c9bda5" font-size="12">HIPAA considerations</text>
 </g>
 <text x="490" y="767" fill="#7f91ae" font-size="12">Conceptual architecture • literature review • not a clinical deployment claim</text>
</g>
