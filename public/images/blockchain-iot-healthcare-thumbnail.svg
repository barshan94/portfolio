 <text x="578" y="426" fill="#f2f6ff" font-size="15" font-weight="700">IDENTITY &amp; ACCESS CONTROL</text><text x="578" y="451" fill="#aab8d0" font-size="13">Authenticate people and devices</text><text x="578" y="472" fill="#aab8d0" font-size="13">Apply permission-based access</text>
