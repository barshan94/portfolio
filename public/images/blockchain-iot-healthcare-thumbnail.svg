 <g transform="translate(1280 176)"><circle cx="20" cy="20" r="20" fill="#4de2e8" fill-opacity=".12" stroke="#4de2e8"/><path d="M20 9v22m-11-11h22" stroke="#4de2e8" stroke-width="2"/><text x="54" y="17" fill="#f2f6ff" font-size="17" font-weight="700">Connected health</text><text x="54" y="40" fill="#9eacc4" font-size="13">Wearables &amp; IoT</text></g>
 <g transform="translate(1280 270)"><circle cx="20" cy="20" r="20" fill="#b3a6ff" fill-opacity=".12" stroke="#b3a6ff"/><path d="M11 15h18v14H11zM15 11h10v4" fill="none" stroke="#b3a6ff" stroke-width="2"/><text x="54" y="17" fill="#f2f6ff" font-size="17" font-weight="700">Distributed trust</text><text x="54" y="40" fill="#9eacc4" font-size="13">Shared audit trail</text></g>
 <g transform="translate(1280 364)"><circle cx="20" cy="20" r="20" fill="#59d9a9" fill-opacity=".12" stroke="#59d9a9"/><path d="M10 20l7 7 14-16" fill="none" stroke="#59d9a9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="54" y="17" fill="#f2f6ff" font-size="17" font-weight="700">Data integrity</text><text x="54" y="40" fill="#9eacc4" font-size="13">Authentication &amp; traceability</text></g>
 <rect x="1280" y="470" width="245" height="168" rx="16" fill="#111c30" stroke="#31425d"/>
 <text x="1302" y="505" fill="#f4c66a" font-size="13" font-weight="800" letter-spacing="1.2">RESEARCH NOTE</text>
 <text x="1302" y="538" fill="#dfe8f8" font-size="14">Blockchain can support</text><text x="1302" y="560" fill="#dfe8f8" font-size="14">auditability; it does not</text><text x="1302" y="582" fill="#dfe8f8" font-size="14">automatically guarantee</text><text x="1302" y="604" fill="#dfe8f8" font-size="14">privacy or HIPAA compliance.</text>
 <text x="1280" y="708" fill="#6f819f" font-size="12" letter-spacing="1">RESEARCH • ARCHITECTURE • SECURITY</text>
