<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Blockchain-based IoT healthcare security thesis</title>
<desc id="desc">Research thumbnail showing wearable patient sensors connected through an IoT gateway and secure network to a blockchain ledger, medical records, and a remote clinician, with authentication, integrity, and privacy themes.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080e1c"/><stop offset="1" stop-color="#101b35"/></linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#50e2e7"/><stop offset="1" stop-color="#59d9a9"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#4de2e8" stop-opacity=".18"/><stop offset="1" stop-color="#4de2e8" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#76dce7" stroke-opacity=".08" stroke-width="1"/></pattern>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".25"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/><circle cx="760" cy="400" r="500" fill="url(#glow)"/>
<path d="M0 4H420" stroke="url(#accent)" stroke-width="5"/><path d="M0 896H1600" stroke="url(#accent)" stroke-width="4" opacity=".65"/>
