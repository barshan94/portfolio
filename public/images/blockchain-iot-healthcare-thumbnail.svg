 <text x="520" y="585" fill="#dfe8f8" font-size="15" font-weight="700" letter-spacing="1">SECURITY CONSIDERATIONS</text>
 <g>
 <rect x="520" y="610" width="205" height="94" rx="12" fill="#14283b" stroke="#4de2e8" stroke-opacity=".5"/>
