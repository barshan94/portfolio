 <rect x="492" y="390" width="298" height="120" rx="16" fill="#17243a" stroke="#4de2e8" stroke-opacity=".65"/>
 <path d="M530 426v-8a12 12 0 0 1 24 0v8m-28 0h32v28h-32z" fill="none" stroke="#4de2e8" stroke-width="2.5" stroke-linejoin="round"/>
