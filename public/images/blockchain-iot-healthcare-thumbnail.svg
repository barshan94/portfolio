 <text x="912" y="479" text-anchor="middle" fill="#f2f6ff" font-size="13" font-weight="700">CLINICIAN</text><text x="912" y="496" text-anchor="middle" fill="#a8d9c9" font-size="11">Remote monitoring</text>
