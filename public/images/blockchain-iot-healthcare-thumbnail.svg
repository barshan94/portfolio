 <rect x="62" y="70" width="342" height="36" rx="18" fill="#9b8cff" fill-opacity=".13" stroke="#9b8cff" stroke-opacity=".5"/>
 <text x="83" y="93" fill="#c3baff" font-size="15" font-weight="700" letter-spacing="2">UNDERGRADUATE THESIS</text>
 <text x="62" y="177" fill="#f5f7ff" font-size="55" font-weight="800" letter-spacing="-1">BLOCKCHAIN</text>
 <text x="62" y="236" fill="#4de2e8" font-size="42" font-weight="600">× IoT HEALTHCARE</text>
 <text x="62" y="283" fill="#f5f7ff" font-size="28" font-weight="700">Security &amp; Trust</text>
 <rect x="62" y="307" width="92" height="5" rx="2.5" fill="url(#accent)"/>
 <text x="62" y="353" fill="#aab8d0" font-size="19">A literature review and proposed</text><text x="62" y="380" fill="#aab8d0" font-size="19">healthcare architecture</text>
 <text x="62" y="436" fill="#dbe5f6" font-size="16" font-weight="700" letter-spacing="1.8">RESEARCH THEMES</text>
 <circle cx="72" cy="472" r="5" fill="#4de2e8"/><text x="91" y="478" fill="#c4cfe2" font-size="17">Wearable sensor networks</text><circle cx="72" cy="514" r="5" fill="#59d9a9"/><text x="91" y="520" fill="#c4cfe2" font-size="17">Remote patient monitoring</text><circle cx="72" cy="556" r="5" fill="#b3a6ff"/><text x="91" y="562" fill="#c4cfe2" font-size="17">Authentication &amp; integrity</text><circle cx="72" cy="598" r="5" fill="#f4c66a"/><text x="91" y="604" fill="#c4cfe2" font-size="17">Privacy &amp; interoperability</text>
 <rect x="62" y="676" width="354" height="110" rx="14" fill="#101b30" stroke="#263954"/>
 <text x="84" y="710" fill="#4de2e8" font-size="14" font-weight="700" letter-spacing="1.5">CORE QUESTION</text>
 <text x="84" y="740" fill="#e8eef9" font-size="16">How can distributed trust support</text><text x="84" y="764" fill="#e8eef9" font-size="16">safer connected healthcare?</text>
</g>
