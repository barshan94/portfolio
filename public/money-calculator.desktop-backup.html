<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MONEY CALCULATOR — Cinematic Transition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#07080a;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;cursor:none}
  #ui{position:fixed;top:14px;right:14px;z-index:50;display:flex;gap:8px;
      font-family:'JetBrains Mono',monospace;opacity:.18;transition:opacity .35s}
  #ui:hover{opacity:1}
  #ui button{background:rgba(10,18,22,.85);border:1px solid rgba(77,212,216,.28);
      color:#8fd6da;font-family:inherit;font-size:9px;letter-spacing:.18em;
      text-transform:uppercase;padding:7px 11px;border-radius:2px;cursor:pointer;
      backdrop-filter:blur(6px);transition:.2s}
  #ui button:hover{background:rgba(77,212,216,.14);color:#dff4f6;border-color:rgba(77,212,216,.6)}
  #hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:50;
      font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.28em;
      color:rgba(120,170,180,.22);text-transform:uppercase;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="ui">
  <button onclick="API.replay()">Replay</button>
  <button onclick="API.toggle()">Pause</button>
  <button onclick="API.exportJPG(2)">Export JPG</button>
  <button onclick="API.exportJPG(4)">4K JPG</button>
  <button onclick="API.saveFile()">Save .html</button>
</div>
<div id="hint">space pause &nbsp;·&nbsp; r replay &nbsp;·&nbsp; e export &nbsp;·&nbsp; 1–6 jump phase</div>

<script>
/* ══════════════════════════════════════════════════════════════
   MONEY CALCULATOR — CINEMATIC TRANSITION ENGINE  (single file)
   Dark graphite · cyan/teal · amber numerics · left→right flow
   ══════════════════════════════════════════════════════════════ */

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha:false });

let W=0, H=0, dpr=1, S=1;
let t=0, playing=true, lastNow=performance.now(), seek=0;

/* ─── Palette ─────────────────────────────────────────────── */
const C = {
  bg:'#07080a', bg2:'#0b0e11',
  grid:'rgba(46,66,76,0.13)', gridMaj:'rgba(58,84,96,0.22)',
  cyan:'#4dd4d8', teal:'#2b9ea0', blue:'#3f8bea', amber:'#d9a84a',
  white:'#e2eef2', dim:'rgba(176,206,214,0.42)'
};
const rgba=(hex,a)=>{const n=parseInt(hex.slice(1),16);
  return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`};

/* ─── Math helpers ────────────────────────────────────────── */
const lerp=(a,b,k)=>a+(b-a)*k;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const eOut=k=>1-Math.pow(1-k,3);
const eIO=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
const ss=(a,b,k)=>{k=clamp((k-a)/(b-a),0,1);return k*k*(3-2*k)};
let _s=1337; const rnd=()=>(_s=_s*16807%2147483647)/2147483647;
const money=v=>v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});

/* ─── Timeline ────────────────────────────────────────────── */
const PH = [
  {id:'BOOT',      d:2.6, label:'initializing financial engine'},
  {id:'STREAM',    d:4.0, label:'streaming transaction data'},
  {id:'NETWORK',   d:4.0, label:'mapping account relationships'},
  {id:'CALCULATE', d:3.4, label:'computing running balances'},
  {id:'RECONCILE', d:3.2, label:'reconciling ledger'},
  {id:'TITLE',     d:6.0, label:'money calculator'}
];
const TOTAL = PH.reduce((a,p)=>a+p.d,0);
const STARTS = PH.reduce((a,p,i)=>(a.push(i?a[i-1]+PH[i-1].d:0),a),[]);
function phaseAt(x){
  for(let i=PH.length-1;i>=0;i--) if(x>=STARTS[i])
    return {i, p:clamp((x-STARTS[i])/PH[i].d,0,1), id:PH[i].id};
  return {i:0,p:0,id:'BOOT'};
}
const after=(x,i)=>x>=STARTS[i];

/* ─── Resize ──────────────────────────────────────────────── */
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  S=clamp(W/1600,.62,1.7);
  canvas.width=W*dpr; canvas.height=H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  build();
}
window.addEventListener('resize',resize);

/* ─── Layout anchors (16:9 cinematic composition) ─────────── */
const L = {
  get ledgerX(){return W*.055}, get ledgerY(){return H*.155},
  get calcX(){return W*.395},   get calcY(){return H*.505},
  get titleR(){return W*.945},  get titleY(){return H*.50}
};

/* ═══════════════════ SYSTEMS ═══════════════════════════════ */

/* 1 ─ Background grid + horizon rails */
function drawGrid(a){
  if(a<.01) return;
  const fine=16*S, maj=96*S;
  ctx.globalAlpha=a*.34; ctx.strokeStyle=C.grid; ctx.lineWidth=.4;
  ctx.beginPath();
  for(let x=0;x<=W;x+=fine){ctx.moveTo(x|0,0);ctx.lineTo(x|0,H)}
  for(let y=0;y<=H;y+=fine){ctx.moveTo(0,y|0);ctx.lineTo(W,y|0)}
  ctx.stroke();
  ctx.globalAlpha=a*.7; ctx.strokeStyle=C.gridMaj; ctx.lineWidth=.55;
  ctx.beginPath();
  for(let x=0;x<=W;x+=maj){ctx.moveTo(x|0,0);ctx.lineTo(x|0,H)}
  for(let y=0;y<=H;y+=maj){ctx.moveTo(0,y|0);ctx.lineTo(W,y|0)}
  ctx.stroke();
  ctx.globalAlpha=1;
}

/* 2 ─ Horizontal flow rails (left→right motion cue) */
const RAILS=[];
function buildRails(){
  RAILS.length=0;
  for(let i=0;i<9;i++) RAILS.push({
    y:H*(.12+i*.095), sp:26+rnd()*70, off:rnd()*1000,
    col:[C.cyan,C.teal,C.blue,C.amber][i%4], a:.08+rnd()*.14
  });
}
function drawRails(a){
  if(a<.01) return;
  ctx.lineWidth=.45; ctx.setLineDash([3*S,10*S]);
  for(const r of RAILS){
    ctx.globalAlpha=a*r.a; ctx.strokeStyle=rgba(r.col,.55);
    ctx.lineDashOffset=-(t*r.sp+r.off);
    ctx.beginPath(); ctx.moveTo(0,r.y|0); ctx.lineTo(W,r.y|0); ctx.stroke();
  }
  ctx.setLineDash([]); ctx.globalAlpha=1;
}

/* 3 ─ Transaction entries (ledger lines in motion) */
const LABELS=['SALARY DEPOSIT','RENT PAYMENT','GROCERY','UTILITIES','SAVINGS XFER',
 'TUITION FEE','LOAN PAYMENT','INDEX FUND','FREELANCE','INSURANCE','TRANSPORT',
 'SUBSCRIPTION','EMERGENCY FUND','TAX WITHHOLD','BONUS','REFUND','INTEREST',
 'DIVIDEND','MEDICAL','TUITION INSTALMENT'];

class Tx{
  constructor(i){
    this.birth = .35 + i*.085 + rnd()*.5;
    this.y0 = H*(.10+rnd()*.80);
    this.x = -W*.08 - rnd()*W*.5;
    this.y = this.y0;
    this.sp = (70+rnd()*170)*S;
    this.cr = rnd()>.42;
    this.amt = (this.cr?1:-1)*(28+rnd()*5200);
    this.lab = LABELS[(rnd()*LABELS.length)|0];
    this.col = this.cr?C.cyan:C.amber;
    this.len = (26+rnd()*86)*S;
    this.w = rnd()<.25?1.1:.55;
    this.tag = rnd()>.55;
    this.ph = rnd()*6.28;
    this.a = 0;
    this.fade = 0;
  }
  update(dt,x,ph){
    if(x<this.birth) return;
    const accel = ph.i>=1 ? 1+ph.i*.22 : .7;
    this.x += this.sp*accel*dt;
    this.y = this.y0 + Math.sin(t*.9+this.ph)*2.2*S;
    this.a = clamp(this.a+dt*2.2,0,1);
    if(ph.i>=4){ this.fade=clamp(this.fade+dt*.75,0,1); }
    if(this.x>W+200){ this.x=-200-rnd()*300; this.y0=H*(.10+rnd()*.80); }
  }
  draw(ph){
    if(this.a<.01) return;
    const vis=this.a*(1-this.fade*.92);
    if(vis<.01) return;
    const pulse=.72+.28*Math.sin(t*2.4+this.ph);
    const x=this.x, y=this.y;

    /* trailing streak */
    const g=ctx.createLinearGradient(x-this.len,y,x,y);
    g.addColorStop(0,rgba(this.col,0));
    g.addColorStop(1,rgba(this.col,.55*vis));
    ctx.strokeStyle=g; ctx.lineWidth=this.w;
    ctx.beginPath(); ctx.moveTo(x-this.len,y); ctx.lineTo(x,y); ctx.stroke();

    /* head glow */
    ctx.globalAlpha=vis*.17*pulse;
    const rg=ctx.createRadialGradient(x,y,0,x,y,22*S);
    rg.addColorStop(0,this.col); rg.addColorStop(1,rgba(this.col,0));
    ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(x,y,22*S,0,6.283); ctx.fill();

    /* head node */
    ctx.globalAlpha=vis*pulse;
    ctx.fillStyle=this.col;
    ctx.beginPath(); ctx.arc(x,y,1.5*S,0,6.283); ctx.fill();

    /* numeric tag */
    if(this.tag && ph.i>=1){
      ctx.globalAlpha=vis*.72;
      ctx.font=`500 ${9*S}px 'JetBrains Mono',monospace`;
      ctx.textAlign='left'; ctx.fillStyle=this.col;
      ctx.fillText((this.cr?'+':'−')+money(Math.abs(this.amt)),x+7*S,y-5*S);
      if(ph.i>=2){
        ctx.globalAlpha=vis*.26;
        ctx.font=`300 ${7*S}px 'JetBrains Mono',monospace`;
        ctx.fillStyle=C.dim;
        ctx.fillText(this.lab,x+7*S,y+7.5*S);
      }
    }
    ctx.globalAlpha=1;
  }
}

/* 4 ─ Financial nodes + connective tissue */
const NODE_DEF=[
  ['INCOME',      C.cyan , .115,.235],
  ['DEPOSITS',    C.teal , .225,.775],
  ['EXPENSES',    C.amber, .300,.215],
  ['SAVINGS',     C.teal , .385,.790],
  ['LOANS',       C.blue , .490,.715],
  ['TUITION',     C.amber, .455,.205],
  ['INVESTMENTS', C.cyan , .585,.300],
  ['TAX',         C.amber, .600,.845]
];
const EDGES=[[0,2],[0,1],[0,6],[2,5],[2,7],[1,3],[3,6],[4,5],[4,3],[6,7],[5,6],[1,4],[0,3],[2,4]];

class Node{
  constructor(n,col,rx,ry){
    this.n=n; this.col=col; this.rx=rx; this.ry=ry;
    this.r=(13+rnd()*9);
    this.v=200+rnd()*900; this.tv=this.v;
    this.ph=rnd()*6.283; this.a=0; this.ring=0; this.hit=0;
  }
  get x(){return W*this.rx} get y(){return H*this.ry}
  update(dt,ph){
    this.ph+=dt*1.15;
    if(ph.i>=2) this.a=clamp(this.a+dt*.9,0,.95);
    if(ph.i>=5) this.a=clamp(this.a-dt*.5,.14,.95);
    this.v=lerp(this.v,this.tv,clamp(dt*2.2,0,1));
    if(ph.i>=2&&ph.i<5&&rnd()<.012){this.tv=400+rnd()*16000;this.hit=1}
    this.hit=clamp(this.hit-dt*2.2,0,1);
    this.ring=clamp(this.ring+dt*.55,0,1);
  }
  draw(){
    if(this.a<.01) return;
    const x=this.x,y=this.y,R=this.r*S;
    const pul=.8+.2*Math.sin(this.ph)+this.hit*.5;

    ctx.globalAlpha=this.a*.07*pul;
    const g=ctx.createRadialGradient(x,y,0,x,y,R*4);
    g.addColorStop(0,this.col); g.addColorStop(1,rgba(this.col,0));
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,R*4,0,6.283); ctx.fill();

    ctx.globalAlpha=this.a*.55; ctx.strokeStyle=this.col; ctx.lineWidth=.8;
    ctx.beginPath(); ctx.arc(x,y,R,-1.5708,-1.5708+6.283*this.ring); ctx.stroke();

    ctx.globalAlpha=this.a*.16;
    ctx.beginPath(); ctx.arc(x,y,R*.56,0,6.283); ctx.stroke();

    ctx.globalAlpha=this.a*.9*pul; ctx.fillStyle=this.col;
    ctx.beginPath(); ctx.arc(x,y,2.1*S,0,6.283); ctx.fill();

    ctx.textAlign='center';
    ctx.globalAlpha=this.a*.72;
    ctx.font=`500 ${8*S}px 'JetBrains Mono',monospace`;
    ctx.fillStyle=this.col; ctx.fillText(this.n,x,y-R-9*S);
    ctx.globalAlpha=this.a*.42;
    ctx.font=`400 ${7.5*S}px 'JetBrains Mono',monospace`;
    ctx.fillStyle=C.dim; ctx.fillText('$'+money(this.v),x,y+R+13*S);
    ctx.globalAlpha=1;
  }
}

class Edge{
  constructor(a,b){this.a=a;this.b=b;this.g=0;this.al=0;
    this.pk=[rnd(),rnd()*.6+.2];this.sp=.18+rnd()*.3}
  update(dt,ph){
    if(ph.i>=2&&ph.i<5){
      this.g=clamp(this.g+dt*.62,0,1);
      this.al=clamp(this.al+dt*.6,0,.42);
      this.pk=this.pk.map(p=>(p+this.sp*dt)%1);
    } else if(ph.i>=5) this.al=clamp(this.al-dt*.34,0,.42);
  }
  draw(){
    if(this.al<.01||this.g<.02) return;
    const ax=this.a.x,ay=this.a.y,bx=this.b.x,by=this.b.y;
    const mx=(ax+bx)/2+(by-ay)*.14, my=(ay+by)/2+(ax-bx)*.14;
    const ex=lerp(ax,bx,this.g), ey=lerp(ay,by,this.g);

    ctx.globalAlpha=this.al*.85; ctx.strokeStyle=rgba(C.cyan,.5); ctx.lineWidth=.42;
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.quadraticCurveTo(mx,my,ex,ey); ctx.stroke();

    if(this.g>.92) for(const k of this.pk){
      const u=1-k, px=u*u*ax+2*u*k*mx+k*k*bx, py=u*u*ay+2*u*k*my+k*k*by;
      ctx.globalAlpha=this.al*2.1; ctx.fillStyle=C.cyan;
      ctx.beginPath(); ctx.arc(px,py,1.35*S,0,6.283); ctx.fill();
      ctx.globalAlpha=this.al*.5;
      ctx.beginPath(); ctx.arc(px,py,4.5*S,0,6.283); ctx.fill();
    }
    ctx.globalAlpha=1;
  }
}

/* 5 ─ Central rolling calculator */
const calc={
  digits:new Array(9).fill(0),
  target:[0,2,4,8,7,1,5,3,6],
  spin:[14,19,11,23,17,27,13,21,29],
  a:0, locked:new Array(9).fill(0),
  update(dt,ph){
    if(ph.i>=3&&ph.i<5) this.a=clamp(this.a+dt*1.5,0,1);
    if(ph.i>=5) this.a=clamp(this.a-dt*.55,.22,1);
    if(ph.i===3) for(let i=0;i<9;i++) this.digits[i]=(this.digits[i]+this.spin[i]*dt)%10;
    if(ph.i>=4){
      for(let i=0;i<9;i++){
        const lk=clamp((ph.p*1.9)-(i*.085),0,1);
        this.locked[i]=lk;
        if(lk<1) this.digits[i]=(this.digits[i]+this.spin[i]*dt*(1-eOut(lk)))%10;
        else this.digits[i]=lerp(this.digits[i],this.target[i],clamp(dt*9,0,1));
      }
    }
  },
  draw(ph){
    if(this.a<.02) return;
    const cx=L.calcX, cy=L.calcY, dw=23*S, gap=7*S;
    const groups=[0,0,0,1,1,1,1,2,2]; // $ 024,871.536 style spacing
    let total=0; for(let i=0;i<9;i++){total+=dw+(i&&groups[i]!==groups[i-1]?gap:0)}
    const x0=cx-total/2;
    const padX=26*S, padY=25*S;

    /* housing */
    ctx.globalAlpha=this.a*.055; ctx.fillStyle=C.cyan;
    ctx.fillRect(x0-padX,cy-padY-9*S,total+padX*2,padY*2+6*S);
    ctx.globalAlpha=this.a*.3; ctx.strokeStyle=rgba(C.cyan,.5); ctx.lineWidth=.55;
    ctx.strokeRect(x0-padX,cy-padY-9*S,total+padX*2,padY*2+6*S);
    /* corner ticks */
    ctx.globalAlpha=this.a*.6; ctx.lineWidth=1;
    const bx=x0-padX, by=cy-padY-9*S, bw=total+padX*2, bh=padY*2+6*S, tk=7*S;
    ctx.beginPath();
    [[bx,by,1,1],[bx+bw,by,-1,1],[bx,by+bh,1,-1],[bx+bw,by+bh,-1,-1]].forEach(([px,py,sx,sy])=>{
      ctx.moveTo(px+sx*tk,py); ctx.lineTo(px,py); ctx.lineTo(px,py+sy*tk);
    });
    ctx.stroke();

    /* caption */
    ctx.globalAlpha=this.a*.4; ctx.textAlign='left';
    ctx.font=`400 ${7.5*S}px 'JetBrains Mono',monospace`; ctx.fillStyle=C.teal;
    ctx.fillText('RECONCILED  NET  BALANCE', x0-padX, by-8*S);
    ctx.textAlign='right'; ctx.globalAlpha=this.a*.3; ctx.fillStyle=C.dim;
    ctx.fillText(ph.i>=4?'STATUS · BALANCED':'STATUS · COMPUTING', x0+total+padX, by-8*S);

    /* currency mark */
    ctx.globalAlpha=this.a*.55; ctx.textAlign='right';
    ctx.font=`300 ${17*S}px 'JetBrains Mono',monospace`; ctx.fillStyle=C.cyan;
    ctx.fillText('$',x0-7*S,cy+7*S);

    /* digits */
    let x=x0;
    ctx.textAlign='center';
    for(let i=0;i<9;i++){
      if(i&&groups[i]!==groups[i-1]){
        ctx.globalAlpha=this.a*.32; ctx.fillStyle=C.dim;
        ctx.font=`400 ${18*S}px 'JetBrains Mono',monospace`;
        ctx.fillText(groups[i]===2?'.':',',x-gap*.45,cy+7*S);
        x+=gap;
      }
      const v=this.digits[i], d=Math.floor(v)%10, f=v-Math.floor(v);
      const dec=groups[i]===2;
      ctx.save();
      ctx.beginPath(); ctx.rect(x-dw/2,cy-15*S,dw,30*S); ctx.clip();
      ctx.globalAlpha=this.a*(.55+this.locked[i]*.42);
      ctx.fillStyle=dec?C.amber:C.white;
      ctx.font=`600 ${20*S}px 'JetBrains Mono',monospace`;
      const yo=-f*22*S;
      ctx.fillText(String(d),x,cy+7*S+yo);
      ctx.fillText(String((d+1)%10),x,cy+7*S+yo+22*S);
      ctx.restore();
      /* lock underline */
      ctx.globalAlpha=this.a*this.locked[i]*.5;
      ctx.strokeStyle=dec?C.amber:C.cyan; ctx.lineWidth=.9;
      ctx.beginPath(); ctx.moveTo(x-dw*.33,cy+15*S); ctx.lineTo(x+dw*.33,cy+15*S); ctx.stroke();
      x+=dw;
    }
    ctx.globalAlpha=1;
  }
};

/* 6 ─ Structured ledger (left column) */
const LEDGER=(()=>{
  const rows=[
    ['SALARY · OCT',        0, 5200.00],
    ['RENT · UNIT 14B',  1850.00, 0],
    ['TUITION · SEM 02', 2400.00, 0],
    ['GROCERIES',         341.80, 0],
    ['LOAN · PRINCIPAL',  380.25, 0],
    ['SAVINGS GOAL',      500.00, 0],
    ['INDEX FUND DCA',   1200.00, 0],
    ['UTILITIES',         164.40, 0],
    ['FREELANCE · INV#22',     0, 1800.00],
    ['INTEREST ACCRUED',       0, 84.15]
  ];
  let bal=0;
  return rows.map(r=>{bal+=r[2]-r[1];return{lab:r[0],d:r[1],c:r[2],b:bal,a:0,dx:34}});
})();

function drawLedger(dt,ph){
  let base=0;
  if(ph.i>=3) base=clamp(base+1,0,1);
  const master = ph.i<3 ? 0 : (ph.i>=5 ? lerp(.82,.26,eIO(ph.p)) : .82);
  if(master<.01) return;

  const x=L.ledgerX, y=L.ledgerY, rh=19*S;
  const col=[0, 168*S, 240*S, 332*S];
  const prog = ph.i===3 ? ph.p*1.1 : 1;

  ctx.textBaseline='alphabetic';
  /* header */
  ctx.globalAlpha=master*.52; ctx.fillStyle=C.teal;
  ctx.font=`500 ${7.2*S}px 'JetBrains Mono',monospace`;
  ctx.textAlign='left';  ctx.fillText('TRANSACTION LEDGER',x,y);
  ctx.textAlign='right';
  ctx.fillText('DEBIT',  x+col[1],y);
  ctx.fillText('CREDIT', x+col[2],y);
  ctx.fillText('BALANCE',x+col[3],y);
  ctx.globalAlpha=master*.3; ctx.strokeStyle=C.teal; ctx.lineWidth=.6;
  ctx.beginPath(); ctx.moveTo(x,y+6*S); ctx.lineTo(x+col[3],y+6*S); ctx.stroke();

  LEDGER.forEach((r,i)=>{
    const k=clamp(prog*LEDGER.length-i,0,1);
    r.a=lerp(r.a,eOut(k),clamp(dt*7,0,1));
    r.dx=lerp(r.dx,0,clamp(dt*6,0,1));
    if(r.a<.01) return;
    const ry=y+22*S+i*rh, A=master*r.a;
    ctx.globalAlpha=A*.64; ctx.font=`400 ${8*S}px 'JetBrains Mono',monospace`;
    ctx.textAlign='left'; ctx.fillStyle=C.dim; ctx.fillText(r.lab,x+r.dx,ry);
    ctx.textAlign='right';
    if(r.d){ctx.fillStyle=C.amber; ctx.fillText(money(r.d),x+col[1]+r.dx,ry)}
    if(r.c){ctx.fillStyle=C.cyan;  ctx.fillText(money(r.c),x+col[2]+r.dx,ry)}
    ctx.globalAlpha=A*.82; ctx.fillStyle=r.b>=0?C.cyan:C.amber;
    ctx.fillText(money(r.b),x+col[3]+r.dx,ry);
    ctx.globalAlpha=A*.07; ctx.strokeStyle=C.teal; ctx.lineWidth=.35;
    ctx.beginPath(); ctx.moveTo(x,ry+6*S); ctx.lineTo(x+col[3],ry+6*S); ctx.stroke();
  });

  /* total rule */
  const last=LEDGER[LEDGER.length-1];
  if(last.a>.6){
    const ry=y+22*S+LEDGER.length*rh;
    ctx.globalAlpha=master*.4; ctx.strokeStyle=C.cyan; ctx.lineWidth=.7;
    ctx.beginPath(); ctx.moveTo(x+col[1],ry-6*S); ctx.lineTo(x+col[3],ry-6*S); ctx.stroke();
    ctx.globalAlpha=master*.62; ctx.textAlign='right';
    ctx.font=`600 ${8.4*S}px 'JetBrains Mono',monospace`; ctx.fillStyle=C.cyan;
    ctx.fillText(money(last.b),x+col[3],ry+8*S);
    ctx.textAlign='left'; ctx.globalAlpha=master*.4; ctx.fillStyle=C.teal;
    ctx.font=`400 ${7.2*S}px 'JetBrains Mono',monospace`;
    ctx.fillText('NET POSITION',x,ry+8*S);
  }
  ctx.globalAlpha=1;
}

/* 7 ─ Reconciliation burst */
function drawReconcile(ph){
  if(ph.id!=='RECONCILE') return;
  const k=eIO(ph.p), cx=L.calcX, cy=L.calcY;
  const N=18;
  for(let i=0;i<N;i++){
    const ang=i/N*6.283+t*.1;
    const r0=lerp(W*.33,26*S,k);
    const r1=r0+lerp(70*S,0,k);
    ctx.globalAlpha=.17*(1-k)*(1-k+.25);
    ctx.strokeStyle=rgba(i%3?C.cyan:C.amber,.8); ctx.lineWidth=.5;
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(ang)*r1,cy+Math.sin(ang)*r1);
    ctx.lineTo(cx+Math.cos(ang)*r0,cy+Math.sin(ang)*r0);
    ctx.stroke();
  }
  /* expanding confirm ring */
  const rr=ss(.55,1,ph.p);
  if(rr>0){
    ctx.globalAlpha=.3*(1-rr); ctx.strokeStyle=C.cyan; ctx.lineWidth=1.1;
    ctx.beginPath(); ctx.arc(cx,cy,lerp(20*S,W*.26,eOut(rr)),0,6.283); ctx.stroke();
  }
  ctx.globalAlpha=.09*k;
  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,W*.18*k);
  g.addColorStop(0,C.cyan); g.addColorStop(1,rgba(C.cyan,0));
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,W*.18*k,0,6.283); ctx.fill();
  ctx.globalAlpha=1;
}

/* 8 ─ Title lockup (right negative space) */
const TITLE='MONEY CALCULATOR';
function drawTitle(ph){
  if(ph.i<5) return;
  const p=ph.p, R=L.titleR, cy=L.titleY;
  const fs=Math.min(W*.046,62*1.0)*1;
  ctx.textAlign='right'; ctx.textBaseline='alphabetic';

  /* eyebrow */
  const e=ss(.06,.3,p);
  ctx.globalAlpha=e*.62; ctx.fillStyle=C.cyan;
  ctx.font=`400 ${11*S}px 'JetBrains Mono',monospace`;
  let eb='PERSONAL  FINANCE  ENGINEERING';
  ctx.save(); ctx.letterSpacing=`${3.4*S}px`;
  ctx.fillText(eb,R,cy-fs*.95); ctx.restore();

  /* main title — per-character reveal */
  ctx.font=`600 ${fs}px 'JetBrains Mono',monospace`;
  ctx.letterSpacing=`${fs*.055}px`;
  const widths=[]; let tw=0;
  for(const ch of TITLE){const w=ctx.measureText(ch).width+fs*.055; widths.push(w); tw+=w}
  let cx=R-tw;
  for(let i=0;i<TITLE.length;i++){
    const k=clamp((p-.10-i*.026)/.17,0,1);
    const a=eOut(k), dy=(1-eOut(k))*16*S;
    if(a>.001){
      ctx.globalAlpha=a*.16; ctx.fillStyle=C.cyan;
      ctx.shadowColor=rgba(C.cyan,.7); ctx.shadowBlur=18*S*(1-k)+5*S;
      ctx.textAlign='left'; ctx.fillText(TITLE[i],cx,cy+dy);
      ctx.shadowBlur=0;
      ctx.globalAlpha=a; ctx.fillStyle=C.white;
      ctx.fillText(TITLE[i],cx,cy+dy);
    }
    cx+=widths[i];
  }
  ctx.letterSpacing='0px';

  /* accent rule */
  const rl=ss(.3,.62,p);
  if(rl>0){
    const w=lerp(0,W*.19,eOut(rl));
    const g=ctx.createLinearGradient(R-w,0,R,0);
    g.addColorStop(0,rgba(C.cyan,0)); g.addColorStop(.6,rgba(C.cyan,.75)); g.addColorStop(1,rgba(C.cyan,.1));
    ctx.globalAlpha=1; ctx.strokeStyle=g; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(R-w,cy+fs*.42); ctx.lineTo(R,cy+fs*.42); ctx.stroke();
  }

  /* sub-line */
  const s2=ss(.42,.78,p);
  ctx.globalAlpha=s2*.4; ctx.fillStyle=C.teal; ctx.textAlign='right';
  ctx.font=`300 ${9.5*S}px 'JetBrains Mono',monospace`;
  ctx.save(); ctx.letterSpacing=`${3*S}px`;
  ctx.fillText('TRANSACTION ENGINE · BALANCE RECONCILIATION · FINANCIAL ARCHITECTURE',R,cy+fs*.95);
  ctx.restore();
  ctx.globalAlpha=1;
}

/* 9 ─ HUD + film treatment */
function drawHUD(x,ph){
  const a=ss(.3,1.4,x)*(ph.i>=5?lerp(1,.45,ph.p):1);
  ctx.globalAlpha=a*.42; ctx.fillStyle=C.teal; ctx.textAlign='left';
  ctx.font=`400 ${8*S}px 'JetBrains Mono',monospace`;
  ctx.save(); ctx.letterSpacing=`${2.6*S}px`;
  ctx.fillText(PH[ph.i].label.toUpperCase(),W*.055,H*.935);
  ctx.restore();
  /* progress bar */
  ctx.globalAlpha=a*.2; ctx.strokeStyle=C.teal; ctx.lineWidth=.6;
  ctx.beginPath(); ctx.moveTo(W*.055,H*.955); ctx.lineTo(W*.055+W*.17,H*.955); ctx.stroke();
  ctx.globalAlpha=a*.7; ctx.strokeStyle=C.cyan; ctx.lineWidth=1.1;
  ctx.beginPath(); ctx.moveTo(W*.055,H*.955); ctx.lineTo(W*.055+W*.17*(x/TOTAL),H*.955); ctx.stroke();
  /* right meta */
  ctx.globalAlpha=a*.22; ctx.textAlign='right'; ctx.fillStyle=C.dim;
  ctx.font=`400 ${7.4*S}px 'JetBrains Mono',monospace`;
  ctx.fillText('SYS.FINANCE.ENGINE  v2.4.1   //   '+String(PH[ph.i].id).padEnd(9,' ')+'  '+(x).toFixed(2)+'s',W*.945,H*.935);
  ctx.globalAlpha=1;
}

function drawFilm(){
  /* scan lines */
  ctx.globalAlpha=.055; ctx.fillStyle='#000';
  for(let y=0;y<H;y+=3) ctx.fillRect(0,y,W,1);
  /* vignette */
  ctx.globalAlpha=1;
  const g=ctx.createRadialGradient(W*.46,H*.5,Math.min(W,H)*.18,W*.46,H*.5,W*.78);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,.72)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  /* top/bottom falloff */
  const g2=ctx.createLinearGradient(0,0,0,H);
  g2.addColorStop(0,'rgba(0,0,0,.42)'); g2.addColorStop(.22,'rgba(0,0,0,0)');
  g2.addColorStop(.8,'rgba(0,0,0,0)'); g2.addColorStop(1,'rgba(0,0,0,.42)');
  ctx.fillStyle=g2; ctx.fillRect(0,0,W,H);
}

/* ─── Ambient motes ───────────────────────────────────────── */
const MOTES=[];
function buildMotes(){
  MOTES.length=0;
  for(let i=0;i<54;i++) MOTES.push({
    x:rnd()*W,y:rnd()*H,vx:(6+rnd()*22),r:(.4+rnd()*1.3),
    a:.06+rnd()*.2,c:[C.cyan,C.teal,C.blue,C.amber][(rnd()*4)|0],ph:rnd()*6.283
  });
}
function drawMotes(dt,a){
  for(const m of MOTES){
    m.x+=m.vx*dt; m.y+=Math.sin(t*.7+m.ph)*.12;
    if(m.x>W+10) m.x=-10;
    ctx.globalAlpha=m.a*a*(.55+.45*Math.sin(t*1.8+m.ph));
    ctx.fillStyle=m.c; ctx.beginPath(); ctx.arc(m.x,m.y,m.r*S,0,6.283); ctx.fill();
  }
  ctx.globalAlpha=1;
}

/* ─── Build / reset ───────────────────────────────────────── */
let TXS=[], NODES=[], LINKS=[];
function build(){
  _s=1337;
  TXS=[]; for(let i=0;i<78;i++) TXS.push(new Tx(i));
  NODES=NODE_DEF.map(d=>new Node(...d));
  LINKS=EDGES.filter(([a,b])=>a<NODES.length&&b<NODES.length)
             .map(([a,b])=>new Edge(NODES[a],NODES[b]));
  LEDGER.forEach(r=>{r.a=0;r.dx=34});
  calc.a=0; calc.digits=new Array(9).fill(0); calc.locked=new Array(9).fill(0);
  buildRails(); buildMotes();
}

/* ─── Frame ───────────────────────────────────────────────── */
function frame(dt){
  const x = seek;
  const ph = phaseAt(x);
  const fade = ss(0,1.1,x);

  /* background */
  ctx.fillStyle=C.bg; ctx.fillRect(0,0,W,H);
  const bg=ctx.createRadialGradient(W*.40,H*.5,0,W*.40,H*.5,W*.75);
  bg.addColorStop(0,'rgba(22,46,56,.10)'); bg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  drawGrid(fade*(ph.i>=5?lerp(1,.55,ph.p):1));
  drawRails(ss(.4,1.8,x)*(ph.i>=5?lerp(1,.3,ph.p):1));
  drawMotes(dt,fade*.9);

  for(const tx of TXS){ tx.update(dt,x,ph); tx.draw(ph); }
  for(const e of LINKS){ e.update(dt,ph); e.draw(); }
  for(const n of NODES){ n.update(dt,ph); n.draw(); }

  drawLedger(dt,ph);
  calc.update(dt,ph); calc.draw(ph);
  drawReconcile(ph);
  drawTitle(ph);
  drawHUD(x,ph);
  drawFilm();
}

/* ─── Loop ────────────────────────────────────────────────── */
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min((now-lastNow)/1000,.05); lastNow=now;
  if(!playing){ return; }
  t+=dt; seek+=dt;
  if(seek>TOTAL+2.0){ seek=0; t=0; build(); }
  frame(dt);
}

/* ─── Public API / controls ───────────────────────────────── */
const API={
  replay(){ seek=0; t=0; build(); playing=true; },
  toggle(){ playing=!playing; if(playing) lastNow=performance.now(); },
  jump(i){ seek=STARTS[clamp(i,0,PH.length-1)]+.001; build(); 
           // fast-forward state so visuals match
           for(let k=0;k<90;k++) frame(1/60); },
  exportJPG(scale){
    const ow=canvas.width, oh=canvas.height;
    canvas.width=Math.round(W*scale); canvas.height=Math.round(H*scale);
    ctx.setTransform(scale,0,0,scale,0,0);
    frame(0);
    const url=canvas.toDataURL('image/jpeg',.96);
    canvas.width=ow; canvas.height=oh; ctx.setTransform(dpr,0,0,dpr,0,0); frame(0);
    const a=document.createElement('a');
    a.href=url; a.download=`money-calculator_${Math.round(W*scale)}x${Math.round(H*scale)}.jpg`;
    a.click();
  },
  saveFile(){
    const html='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
    const url=URL.createObjectURL(new Blob([html],{type:'text/html'}));
    const a=document.createElement('a');
    a.href=url; a.download='money-calculator.html'; a.click();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
  }
};
window.API=API;

addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k===' '){e.preventDefault();API.toggle()}
  else if(k==='r') API.replay();
  else if(k==='e') API.exportJPG(2);
  else if(k>='1'&&k<='6') API.jump(+k-1);
});

/* ─── Boot (wait for font so canvas text is correct) ──────── */
function start(){ resize(); lastNow=performance.now(); requestAnimationFrame(loop); }
if(document.fonts && document.fonts.ready){
  document.fonts.load("600 20px 'JetBrains Mono'").then(()=>document.fonts.ready).then(start).catch(start);
} else start();
</script>
