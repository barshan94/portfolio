<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mount Royal Academy</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#080d1a}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:1}
#title{
  position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;
  align-items:center;justify-content:center;pointer-events:none;opacity:0;
  transition:opacity 1s ease;
}
#title.on{opacity:1}
#title h1{
  font:700 clamp(1.6rem,5vw,4rem)/1.15 Georgia,serif;
  letter-spacing:.12em;text-transform:uppercase;color:#f0ead6;
  text-align:center;text-shadow:0 0 40px rgba(212,175,85,.15);
  opacity:0;transform:translateY(16px);transition:opacity 1.2s ease,transform 1.2s ease;
}
#title h1.on{opacity:1;transform:translateY(0)}
#title .rule{
  width:0;height:1px;margin-top:14px;
  background:linear-gradient(90deg,transparent,rgba(212,175,85,.55),transparent);
  transition:width 2s ease .2s;
}
#title .rule.on{width:clamp(100px,20vw,260px)}
#title p{
  margin-top:14px;font:500 clamp(.55rem,1.2vw,.9rem)/1 system-ui,sans-serif;
  letter-spacing:.3em;text-transform:uppercase;color:rgba(160,185,220,0);
  transition:color 1s ease .5s;
}
#title p.on{color:rgba(160,185,220,.6)}
#dbg{
  position:fixed;top:8px;left:8px;z-index:99;color:rgba(160,185,220,.35);
  font:10px/1.4 monospace;pointer-events:none;
}
#ctrls{
  position:fixed;top:8px;right:8px;z-index:50;display:flex;gap:5px;
  opacity:.12;transition:opacity .3s;
}
#ctrls:hover{opacity:1}
#ctrls button{
  background:rgba(8,13,26,.85);border:1px solid rgba(160,185,220,.2);
  color:rgba(160,185,220,.7);font:9px/1 system-ui,sans-serif;
  letter-spacing:.1em;text-transform:uppercase;padding:7px 10px;
  border-radius:3px;cursor:pointer;min-height:34px;
}
#ctrls button:hover{background:rgba(40,60,100,.3);color:#dce4f0}
#skip{
  position:fixed;bottom:20px;right:20px;z-index:50;
  background:rgba(8,13,26,.78);border:1px solid rgba(160,185,220,.2);
  color:rgba(160,185,220,.5);font:10px/1 system-ui,sans-serif;
  letter-spacing:.1em;text-transform:uppercase;padding:9px 14px;
  border-radius:3px;cursor:pointer;min-height:40px;transition:opacity .4s;
}
#skip:hover{background:rgba(40,60,100,.3);color:#dce4f0}
#skip.off{opacity:0;pointer-events:none}
#hud{
  position:fixed;left:16px;bottom:16px;z-index:50;pointer-events:none;
  font:8px/1.4 system-ui,sans-serif;letter-spacing:.2em;
  text-transform:uppercase;color:rgba(130,160,200,.25);
}
#prog{width:120px;height:1px;margin-top:5px;background:rgba(130,160,200,.1)}
#progF{height:100%;width:0%;background:rgba(212,175,85,.45)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">
  <h1 id="tName">Mount Royal<br>Academy</h1>
  <div class="rule" id="tRule"></div>
  <p id="tTag">Learn &nbsp;·&nbsp; Grow &nbsp;·&nbsp; Achieve</p>
</div>
<div id="dbg"></div>
<div id="ctrls">
  <button id="bReplay">Replay</button>
  <button id="bPause">Pause</button>
  <button id="bExport">Export</button>
</div>
<button id="skip">Skip Intro ↗</button>
<div id="hud"><span id="phLbl"></span><div id="prog"><div id="progF"></div></div></div>
<script>
var c = document.getElementById('c');
var x = c.getContext('2d');
var dbg = document.getElementById('dbg');
var W, H, S, mob;

/* ── Resize (same as working test) ─────────────────────────── */
function resize(){
  var d = Math.min(window.devicePixelRatio||1,2);
  W = window.innerWidth; H = window.innerHeight;
  S = Math.max(.45, Math.min(1.5, W/1400));
  mob = W < 640;
  c.width = W*d; c.height = H*d;
  x.setTransform(d,0,0,d,0,0);
}
window.addEventListener('resize',resize);
resize();

/* ── Helpers ───────────────────────────────────────────────── */
var sd = 42;
function rn(){sd=(sd*16807)%2147483647;return sd/2147483647}
function lr(a,b,k){return a+(b-a)*k}
function cl(v,a,b){return v<a?a:v>b?b:v}
function eo(k){return 1-Math.pow(1-k,3)}
function eio(k){return k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2}
function sm(a,b,k){k=cl((k-a)/(b-a),0,1);return k*k*(3-2*k)}
function ha(hex,a){var n=parseInt(hex.slice(1),16);return'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')'}

/* ── Colors ────────────────────────────────────────────────── */
var BG='#080d1a',NV='#0e1630',RB='#1e3a6e',SK='#4a8ec8',CY='#5eb8d4',GD='#d4af55',WH='#f0ead6';

/* ── Timeline ──────────────────────────────────────────────── */
var PD=[3.0,3.5,4.0,3.5,3.5,4.5,4.0];
var PL=['the spark of curiosity','the foundation of knowledge','discovery and understanding',
        'connecting ideas','growth and aspiration','mount royal academy','mount royal academy'];
var TOT=0,PS=[];
for(var i=0;i<PD.length;i++){PS.push(TOT);TOT+=PD[i]}

function gp(sk){
  for(var i=PD.length-1;i>=0;i--)if(sk>=PS[i])return{i:i,p:cl((sk-PS[i])/PD[i],0,1)};
  return{i:0,p:0};
}

/* ── State ─────────────────────────────────────────────────── */
var fc=0,t=0,sk=0,prevNow=0,paused=false,ended=false,titled=false;

/* ═══════════ PARTICLES ═══════════ */
var pts=[];
function mkPts(){
  pts=[];sd=101;
  var n=mob?25:50;
  for(var i=0;i<n;i++)pts.push({
    x:rn()*W,y:rn()*H,vx:-2+rn()*4,vy:-4-rn()*8,
    r:(.35+rn()*1.2)*S,a:.025+rn()*.1,
    c:rn()>.6?GD:(rn()>.5?SK:CY),ph:rn()*6.283
  });
}

function drPts(dt,f){
  for(var i=0;i<pts.length;i++){
    var p=pts[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt*.3;
    p.x+=Math.sin(t*.5+p.ph)*.12;
    if(p.y<-15){p.y=H+15;p.x=rn()*W}
    if(p.x<-15)p.x=W+15;if(p.x>W+15)p.x=-15;
    x.globalAlpha=p.a*f*(.5+.5*Math.sin(t*1.2+p.ph));
    x.fillStyle=p.c;
    x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fill();
  }
  x.globalAlpha=1;
}

/* ═══════════ GRID ═══════════ */
function drGrid(f){
  if(f<.005)return;
  var fn=22*S,mj=132*S,gx,gy;
  x.globalAlpha=f*.35;x.strokeStyle=ha(RB,.2);x.lineWidth=.3;
  x.beginPath();
  for(gx=0;gx<=W;gx+=fn){x.moveTo(gx|0,0);x.lineTo(gx|0,H)}
  for(gy=0;gy<=H;gy+=fn){x.moveTo(0,gy|0);x.lineTo(W,gy|0)}
  x.stroke();
  x.globalAlpha=f*.6;x.strokeStyle=ha(RB,.35);x.lineWidth=.45;
  x.beginPath();
  for(gx=0;gx<=W;gx+=mj){x.moveTo(gx|0,0);x.lineTo(gx|0,H)}
  for(gy=0;gy<=H;gy+=mj){x.moveTo(0,gy|0);x.lineTo(W,gy|0)}
  x.stroke();x.globalAlpha=1;
}

/* ═══════════ SPARK ═══════════ */
var spX=0,spY=0,tr=[];

function drSpark(ph){
  var vis;
  if(ph.i===0){
    var k=eio(ph.p);
    spX=lr(W*.06,W*.52,k);spY=lr(H*.56,H*.48,k)+Math.sin(t*2.3)*4*S;
    tr.push({x:spX,y:spY,a:1});if(tr.length>90)tr.shift();
    vis=1;
  }else if(ph.i===1){
    var k2=eio(ph.p);
    spX=lr(W*.52,W*.5,k2);spY=lr(H*.48,H*.5,k2)+Math.sin(t*1.8)*2*S;
    tr.push({x:spX,y:spY,a:1});if(tr.length>90)tr.shift();
    vis=1;
  }else{
    vis=cl(1-(ph.i===2?ph.p*2.5:10),0,1);
  }
  for(var i=0;i<tr.length;i++)tr[i].a*=.92;
  if(vis<.01)return;
  var pu=.65+.35*Math.sin(t*3.2);
  /* trail */
  if(tr.length>1){
    x.lineWidth=1.6*S;x.lineCap='round';
    for(var j=1;j<tr.length;j++){
      var a=tr[j].a*vis*.5;if(a<.003)continue;
      x.globalAlpha=a;x.strokeStyle=GD;
      x.beginPath();x.moveTo(tr[j-1].x,tr[j-1].y);x.lineTo(tr[j].x,tr[j].y);x.stroke();
    }
  }
  /* outer glow */
  x.globalAlpha=vis*.22*pu;
  var g=x.createRadialGradient(spX,spY,0,spX,spY,60*S);
  g.addColorStop(0,GD);g.addColorStop(1,ha(GD,0));
  x.fillStyle=g;x.beginPath();x.arc(spX,spY,60*S,0,6.283);x.fill();
  /* inner glow */
  x.globalAlpha=vis*.12*pu;
  var g2=x.createRadialGradient(spX,spY,0,spX,spY,25*S);
  g2.addColorStop(0,WH);g2.addColorStop(1,ha(WH,0));
  x.fillStyle=g2;x.beginPath();x.arc(spX,spY,25*S,0,6.283);x.fill();
  /* core */
  x.globalAlpha=vis*pu;x.fillStyle=WH;
  x.beginPath();x.arc(spX,spY,3.2*S,0,6.283);x.fill();
  /* ring */
  x.globalAlpha=vis*.18*pu;x.strokeStyle=GD;x.lineWidth=.6;
  x.beginPath();x.arc(spX,spY,20*S,0,6.283);x.stroke();
  x.globalAlpha=1;
}

/* ═══════════ BOOK ═══════════ */
function drBook(ph){
  if(ph.i<1)return;
  var ap=ph.i===1?eio(cl(ph.p*1.6,0,1)):1;
  var fd=ph.i>=4?cl(1-ph.p*1.4,0,1):1;
  var v=ap*fd;if(v<.01)return;
  var cx=W*.5,cy=H*.5,bw=105*S,bh=62*S,oa=ap*.52;
  x.save();x.translate(cx,cy);
  x.globalAlpha=v*.55;x.strokeStyle=GD;x.lineWidth=.9*S;
  /* left page */
  x.beginPath();x.moveTo(0,bh*.4);x.lineTo(-bw*oa,-bh*.1);
  x.lineTo(-bw*oa*.6,-bh*.52);x.lineTo(0,-bh*.15);x.closePath();x.stroke();
  /* right page */
  x.beginPath();x.moveTo(0,bh*.4);x.lineTo(bw*oa,-bh*.1);
  x.lineTo(bw*oa*.6,-bh*.52);x.lineTo(0,-bh*.15);x.closePath();x.stroke();
  /* spine */
  x.globalAlpha=v*.7;x.lineWidth=1.5*S;
  x.beginPath();x.moveTo(0,bh*.4);x.lineTo(0,-bh*.15);x.stroke();
  /* page glow */
  x.globalAlpha=v*.04;
  var pg=x.createRadialGradient(0,-bh*.05,0,0,-bh*.05,bw*.5);
  pg.addColorStop(0,GD);pg.addColorStop(1,ha(GD,0));
  x.fillStyle=pg;x.beginPath();x.arc(0,-bh*.05,bw*.5,0,6.283);x.fill();
  /* text lines */
  if(ap>.35){
    var lv=cl((ap-.35)*3,0,1)*v;
    x.globalAlpha=lv*.28;x.strokeStyle=ha(GD,.4);x.lineWidth=.4;
    for(var i=0;i<5;i++){
      var ly=lr(-bh*.02,bh*.3,i/4),lx=bw*oa*(.22+i*.1);
      x.beginPath();x.moveTo(-lx*.35,ly);x.lineTo(-lx,ly);x.stroke();
      x.beginPath();x.moveTo(lx*.35,ly);x.lineTo(lx,ly);x.stroke();
    }
  }
  /* rising streams */
  if(ap>.55){
    var sv=cl((ap-.55)*3,0,1)*v;x.globalAlpha=sv*.06;
    for(var si=0;si<7;si++){
      var sx=lr(-bw*.35,bw*.35,si/6),sh=(50+si*12)*S;
      var sg=x.createLinearGradient(sx,-bh*.2,sx,-bh*.2-sh);
      sg.addColorStop(0,ha(GD,.5));sg.addColorStop(1,ha(GD,0));
      x.fillStyle=sg;x.fillRect(sx-1.5*S,-bh*.2-sh,3*S,sh);
    }
  }
  x.restore();x.globalAlpha=1;
}

/* ═══════════ SYMBOLS ═══════════ */
var sy=[];
var SL=['E=mc²','∫f(x)dx','Σ','π','Δ','∞','√x','λ','α','β',
       'H₂O','F=ma','a²+b²','∂/∂x','log n','φ','θ','Ω','∇','μ','σ','ε','DNA','dy/dx'];

function mkSy(){
  sy=[];sd=77;
  var n=mob?14:24;
  for(var i=0;i<n;i++){
    var ag=(i/n)*6.283+rn()*.55;
    var ds=(.15+rn()*.3)*Math.min(W,H);
    sy.push({
      lb:SL[i%SL.length],
      hx:W*.5+Math.cos(ag)*ds,hy:H*.45+Math.sin(ag)*ds*.6,
      cx:W*.5,cy:H*.5,a:0,ph:rn()*6.283,sp:.2+rn()*.35,
      cl:rn()>.5?GD:(rn()>.5?SK:CY),sz:(7+rn()*5)*S,
      ct:rn()>.45?Math.floor(rn()*n):-1
    });
  }
  for(var j=0;j<sy.length;j++)if(sy[j].ct===j)sy[j].ct=(j+1)%sy.length;
}

function drSy(ph){
  var i,s,em,rise;
  /* update positions */
  for(i=0;i<sy.length;i++){
    s=sy[i];
    em=ph.i>=2?cl((ph.i===2?ph.p:1)-.025*i/sy.length,0,1):0;
    s.a=eo(cl(em*3,0,1));
    rise=ph.i>=4?cl(ph.p,0,1):0;
    if(ph.i>=5)s.a=cl(s.a*(1-ph.p*.85),0,1);
    s.cx=lr(W*.5,s.hx,s.a)+Math.sin(t*s.sp+s.ph)*3.5*S;
    s.cy=lr(H*.5,s.hy-rise*40*S,s.a)+Math.cos(t*s.sp*.7+s.ph)*2.5*S;
  }
  /* connections */
  if(ph.i>=3){
    x.lineWidth=.35;
    for(i=0;i<sy.length;i++){
      s=sy[i];if(s.a<.03||s.ct<0)continue;
      var tg=sy[s.ct];if(!tg||tg.a<.03)continue;
      var ca=cl((ph.i===3?ph.p:1)*s.a*tg.a,0,.2);
      if(ph.i>=5)ca*=cl(1-ph.p*2,0,1);if(ca<.004)continue;
      x.globalAlpha=ca;x.strokeStyle=ha(SK,.4);
      x.beginPath();x.moveTo(s.cx,s.cy);x.lineTo(tg.cx,tg.cy);x.stroke();
      /* traveling dot */
      if(ph.i<5){
        var tp=(t*s.sp*.35+i*.08)%1;
        x.globalAlpha=ca*2.5;x.fillStyle=CY;
        x.beginPath();x.arc(lr(s.cx,tg.cx,tp),lr(s.cy,tg.cy,tp),1.3*S,0,6.283);x.fill();
      }
    }
  }
  /* labels */
  for(i=0;i<sy.length;i++){
    s=sy[i];if(s.a<.02)continue;
    x.globalAlpha=s.a*.09;
    var g=x.createRadialGradient(s.cx,s.cy,0,s.cx,s.cy,16*S);
    g.addColorStop(0,s.cl);g.addColorStop(1,ha(s.cl,0));
    x.fillStyle=g;x.beginPath();x.arc(s.cx,s.cy,16*S,0,6.283);x.fill();
    x.globalAlpha=s.a*.72;x.font=s.sz+'px Georgia,serif';
    x.fillStyle=s.cl;x.textAlign='center';x.textBaseline='middle';
    x.fillText(s.lb,s.cx,s.cy);
  }
  x.globalAlpha=1;
}

/* ═══════════ GEOMETRY ═══════════ */
function drGeo(ph){
  if(ph.i<2)return;
  var ap=ph.i===2?eo(ph.p):1;
  var fd=ph.i>=5?cl(1-ph.p*2,0,1):1;
  var v=ap*fd;if(v<.015)return;
  var cx=W*.5,cy=H*.44,tR=72*S*ap,cR=105*S*ap;
  /* triangle */
  x.globalAlpha=v*.28;x.strokeStyle=ha(SK,.45);x.lineWidth=.6;
  x.beginPath();
  for(var i=0;i<=3;i++){
    var a=i/3*6.283-1.5708;
    if(i===0)x.moveTo(cx+Math.cos(a)*tR,cy+Math.sin(a)*tR*.6);
    else x.lineTo(cx+Math.cos(a)*tR,cy+Math.sin(a)*tR*.6);
  }
  x.stroke();
  /* circles */
  x.globalAlpha=v*.2;x.strokeStyle=ha(GD,.4);
  x.beginPath();x.arc(cx,cy,cR,-1.5708,-1.5708+6.283*cl(ap*1.2,0,1));x.stroke();
  x.globalAlpha=v*.1;x.strokeStyle=ha(SK,.25);
  x.beginPath();x.arc(cx,cy,cR*1.35,-1.2,-1.2+6.283*cl(ap*1.1,0,1));x.stroke();
  /* radials */
  if(ph.i>=3){
    var cv=(ph.i===3?eio(ph.p):1)*fd;
    x.globalAlpha=cv*.1;x.strokeStyle=ha(CY,.25);x.lineWidth=.3;
    for(var j=0;j<14;j++){
      var ra=j/14*6.283+t*.02;
      x.beginPath();
      x.moveTo(cx+Math.cos(ra)*tR*.65,cy+Math.sin(ra)*tR*.6*.65);
      x.lineTo(cx+Math.cos(ra)*cR*1.25,cy+Math.sin(ra)*cR*.6*1.25);
      x.stroke();
    }
  }
  /* center */
  x.globalAlpha=v*.22;x.strokeStyle=GD;x.lineWidth=.5;
  x.beginPath();x.arc(cx,cy,9*S,0,6.283);x.stroke();
  x.globalAlpha=v*.55;x.fillStyle=GD;
  x.beginPath();x.arc(cx,cy,2.2*S,0,6.283);x.fill();
  x.globalAlpha=1;
}

/* ═══════════ ARCHITECTURE ═══════════ */
function drArch(ph){
  if(ph.i<4)return;
  var ap=ph.i===4?eio(ph.p):1;
  var fd=ph.i>=6?cl(1-ph.p*.45,0,1):1;
  var v=ap*fd;if(v<.015)return;
  var cx=W*.5,by=H*.72;
  var bw=cl(200*S,120,360),bh=cl(130*S,80,240);
  x.save();x.translate(cx,by);
  /* foundation */
  x.globalAlpha=v*.35;x.strokeStyle=GD;x.lineWidth=.8;
  x.beginPath();x.moveTo(-bw*.72,0);x.lineTo(bw*.72,0);x.stroke();
  /* body */
  x.globalAlpha=v*.28;x.lineWidth=.7;
  x.beginPath();x.moveTo(-bw*.6,0);x.lineTo(-bw*.6,-bh*.55*ap);
  x.lineTo(-bw*.18,-bh*.84*ap);x.lineTo(0,-bh*ap);
  x.lineTo(bw*.18,-bh*.84*ap);x.lineTo(bw*.6,-bh*.55*ap);
  x.lineTo(bw*.6,0);x.stroke();
  /* pediment */
  x.globalAlpha=v*.18;x.lineWidth=.5;
  x.beginPath();x.moveTo(-bw*.5,-bh*.55*ap);x.lineTo(0,-bh*.9*ap);
  x.lineTo(bw*.5,-bh*.55*ap);x.stroke();
  /* columns */
  x.globalAlpha=v*.2;x.lineWidth=.5;
  for(var c=0;c<6;c++){
    var cx2=lr(-bw*.48,bw*.48,c/5),ch=bh*.48*ap;
    x.beginPath();x.moveTo(cx2,0);x.lineTo(cx2,-ch);x.stroke();
    x.beginPath();x.moveTo(cx2-3*S,-ch);x.lineTo(cx2+3*S,-ch);x.stroke();
    x.beginPath();x.moveTo(cx2-2.5*S,0);x.lineTo(cx2+2.5*S,0);x.stroke();
  }
  /* lintel */
  x.globalAlpha=v*.22;x.lineWidth=.6;
  x.beginPath();x.moveTo(-bw*.52,-bh*.5*ap);x.lineTo(bw*.52,-bh*.5*ap);x.stroke();
  /* windows */
  x.globalAlpha=v*.09;x.fillStyle=GD;
  for(var wr=0;wr<2;wr++)for(var wc=0;wc<4;wc++){
    x.fillRect(lr(-bw*.35,bw*.35,wc/3)-3.5*S,lr(-bh*.18,-bh*.4,wr)*ap-5*S,7*S,10*S);
  }
  /* door */
  x.globalAlpha=v*.14;x.strokeStyle=GD;x.lineWidth=.6;
  x.beginPath();x.moveTo(-9*S,0);x.lineTo(-9*S,-20*S*ap);
  x.arc(0,-20*S*ap,9*S,Math.PI,0);x.lineTo(9*S,0);x.stroke();
  /* steps */
  x.globalAlpha=v*.15;x.lineWidth=.4;
  for(var st=1;st<=3;st++){
    x.beginPath();x.moveTo(-bw*(.15+st*.06),st*4*S);x.lineTo(bw*(.15+st*.06),st*4*S);x.stroke();
  }
  /* upward light */
  if(ap>.4){
    x.globalAlpha=cl((ap-.4)*1.7,0,1)*v*.045;
    var rg=x.createLinearGradient(0,-bh*1.7*ap,0,-bh*.2*ap);
    rg.addColorStop(0,ha(GD,0));rg.addColorStop(.4,ha(GD,.35));rg.addColorStop(1,ha(GD,0));
    x.fillStyle=rg;x.beginPath();
    x.moveTo(-bw*.12,0);x.lineTo(-bw*.03,-bh*1.7*ap);
    x.lineTo(bw*.03,-bh*1.7*ap);x.lineTo(bw*.12,0);x.closePath();x.fill();
  }
  /* flag */
  x.globalAlpha=v*.3;x.strokeStyle=GD;x.lineWidth=.5;
  x.beginPath();x.moveTo(0,-bh*ap);x.lineTo(0,-bh*ap-18*S*ap);x.stroke();
  x.globalAlpha=v*.25;x.fillStyle=GD;
  x.beginPath();x.arc(0,-bh*ap-18*S*ap,1.8*S,0,6.283);x.fill();
  x.restore();x.globalAlpha=1;
}

/* ═══════════ LIGHT SWEEP ═══════════ */
function drSweep(ph){
  if(ph.i<4)return;
  var sp;
  if(ph.i===4)sp=eio(cl(ph.p*2-.8,0,1));
  else if(ph.i===5)sp=eio(ph.p);
  else return;
  if(sp<.01)return;
  var sx=lr(-W*.3,W*1.3,sp),sw=W*.2;
  x.globalAlpha=.065;
  var g=x.createLinearGradient(sx-sw,0,sx+sw,0);
  g.addColorStop(0,'rgba(212,175,85,0)');g.addColorStop(.5,'rgba(212,175,85,.3)');
  g.addColorStop(1,'rgba(212,175,85,0)');
  x.fillStyle=g;x.fillRect(sx-sw,0,sw*2,H);x.globalAlpha=1;
}

/* ═══════════ FILM TREATMENT ═══════════ */
function drFilm(){
  x.globalAlpha=1;
  var g=x.createRadialGradient(W*.5,H*.47,Math.min(W,H)*.2,W*.5,H*.47,W*.7);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.58)');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  var g2=x.createLinearGradient(0,0,0,H);
  g2.addColorStop(0,'rgba(0,0,0,.28)');g2.addColorStop(.18,'rgba(0,0,0,0)');
  g2.addColorStop(.82,'rgba(0,0,0,0)');g2.addColorStop(1,'rgba(0,0,0,.28)');
  x.fillStyle=g2;x.fillRect(0,0,W,H);
  x.globalAlpha=.028;x.fillStyle='#000';
  for(var y=0;y<H;y+=3)x.fillRect(0,y,W,1);
  x.globalAlpha=1;
}

/* ═══════════ TITLE REVEAL ═══════════ */
function showT(){
  if(titled)return;titled=true;
  document.getElementById('title').classList.add('on');
  setTimeout(function(){
    document.getElementById('tName').classList.add('on');
    document.getElementById('tRule').classList.add('on');
    document.getElementById('tTag').classList.add('on');
  },80);
}
function hideT(){
  titled=false;
  document.getElementById('title').classList.remove('on');
  document.getElementById('tName').classList.remove('on');
  document.getElementById('tRule').classList.remove('on');
  document.getElementById('tTag').classList.remove('on');
}

/* ═══════════ INIT ═══════════ */
function init(){
  sd=42;tr=[];spX=W*.06;spY=H*.56;
  mkPts();mkSy();
  hideT();
  document.getElementById('skip').classList.remove('off');
}

/* ═══════════ MAIN LOOP — same pattern as working test ═══════════ */
init();
prevNow = performance.now();

function loop(now){
  requestAnimationFrame(loop);

  /* dt calc — same approach as working test */
  var dt = (now - prevNow) / 1000;
  if(dt > .1) dt = .016; /* cap large gaps */
  prevNow = now;
  fc++;

  if(paused) return;

  t += dt;
  if(!ended) sk += dt;
  if(sk > TOT){ sk = TOT; ended = true; }

  var ph = gp(sk);
  var fade = sm(0, 1.5, sk);

  /* background */
  x.fillStyle = BG; x.fillRect(0, 0, W, H);
  var bg = x.createRadialGradient(W*.5, H*.44, 0, W*.5, H*.44, W*.55);
  bg.addColorStop(0, ha(NV, .5)); bg.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = bg; x.fillRect(0, 0, W, H);

  /* draw layers */
  drGrid(fade * (ph.i >= 6 ? lr(1, .3, ph.p) : 1));
  drPts(dt, fade * .8);
  drSpark(ph);
  drBook(ph);
  drGeo(ph);
  drSy(ph);
  drArch(ph);
  drSweep(ph);
  drFilm();

  /* title */
  if(ph.i >= 5 && ph.p > .18) showT();
  if(ph.i >= 6) document.getElementById('skip').classList.add('off');

  /* hud */
  document.getElementById('phLbl').textContent = PL[ph.i];
  document.getElementById('progF').style.width = (sk/TOT*100)+'%';

  /* debug */
  dbg.textContent = 'F:'+fc+' T:'+t.toFixed(1)+'s PH:'+ph.i+' '+W+'x'+H;
}

requestAnimationFrame(loop);

/* ═══════════ CONTROLS ═══════════ */
document.getElementById('bReplay').onclick = function(){
  sk=0;t=0;fc=0;ended=false;paused=false;init();
  prevNow=performance.now();
  document.getElementById('bPause').textContent='Pause';
};
document.getElementById('bPause').onclick = function(){
  if(ended&&paused){document.getElementById('bReplay').onclick();return}
  paused=!paused;
  if(!paused)prevNow=performance.now();
  this.textContent=paused?'Play':'Pause';
};
document.getElementById('skip').onclick = function(){
  sk=PS[5]+.5;if(paused){paused=false;prevNow=performance.now()}
  document.getElementById('bPause').textContent='Pause';
};
document.getElementById('bExport').onclick = function(){
  var ow=c.width,oh=c.height,sc=2;
  c.width=Math.round(W*sc);c.height=Math.round(H*sc);
  x.setTransform(sc,0,0,sc,0,0);
  var ph=gp(sk);var fade=sm(0,1.5,sk);
  x.fillStyle=BG;x.fillRect(0,0,W,H);
  drGrid(fade);drPts(0,fade*.8);drSpark(ph);drBook(ph);
  drGeo(ph);drSy(ph);drArch(ph);drSweep(ph);drFilm();
  var url=c.toDataURL('image/jpeg',.95);
  c.width=ow;c.height=oh;
  var d=Math.min(window.devicePixelRatio||1,2);
  x.setTransform(d,0,0,d,0,0);
  var a=document.createElement('a');a.href=url;
  a.download='mount-royal-academy.jpg';a.click();
};
document.addEventListener('keydown',function(e){
  if(e.key===' '){e.preventDefault();document.getElementById('bPause').onclick()}
  else if(e.key==='r')document.getElementById('bReplay').onclick();
  else if(e.key==='s'||e.key==='Escape')document.getElementById('skip').onclick();
});
</script>
</body>
